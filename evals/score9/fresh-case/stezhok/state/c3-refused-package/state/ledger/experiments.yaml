- id: EXP-001
  tests:
  - HYP-001
  decision: DEC-001
  expected_change: 'discovery: проверить полезность кабинетного аудита. Матрица должна
    различить границы доказательства и предложить владельцу проверяемое изменение
    требования; не измерение спроса и не основание масштабирования.'
  metric: Число примеров с корректными источником, областью, ограничением и следующим
    допустимым действием / число заданных классов примеров (CLM-006); дополнительно
    явный вердикт владельца о полезности результата.
  comparison: Те же примеры до и после аудита; исходная порядковая модель HYP-001,
    а не измеренная базовая конверсия.
  duration: Один полный внутренний кабинетный проход после C3; окно — от начала сверки
    заданных классов до явного вердикта инициатора. Лимит активного труда 2 часа по
    HYP-004; это трудозатраты, не длительность наблюдения за жителями.
  effort: Сценарно один синтетический аналитик, до 2 часов × 1000 рублей/час, до 2000
    рублей труда; прямой доход 0 (HYP-004, CLM-010). Реальный бюджет не выделен, новых
    платных вызовов и контактов нет.
  side_effects:
  - Ошибочно принять чужие правила за функции своего сервиса.
  - Продолжить кабинетное исследование без полезного решения и затратить время.
  stop_go: 'Предложение к C3 по CHG-001, ещё не утверждено. Сначала stop: любое приписывание
    аналога Стежку, нарушение запрета, превышение 2 часов труда по HYP-004 либо явный
    ответ инициатора об отсутствии полезного изменения. Если stop не выполнен, go
    только когда все заданные классы CLM-006 имеют корректные источник, область, ограничение
    и следующее допустимое действие И инициатор явно подтвердил полезное изменение
    требования И труд не превышает 2 часа. Равенство лимиту допустимо; более лимита
    — stop. При отсутствии ответа/строк — недостаток данных: сохранить материал, запросить
    только недостающее, до go пауза. При конфликте stop важнее go. Серая зона: полный
    материал, но полезность неоднозначна — сохранить и вынести решение инициатору
    без новой работы. Go допускает лишь внутреннее обсуждение результата, не масштабирование,
    запуск или публикацию. Порог труда — независимый сценарный предел, не денежная
    безубыточность.'
  status_note: 'CHG-001: после отдельного синтетического C2 уточнены длительность/усилие
    и stop_go по HYP-004; это предложения к C3, EXP не исполнялся. CLI-прогон CLM-008/009
    не измеряет полезность и не является результатом EXP-001.'
  owner: Инициатор и аналитик — синтетические роли, реальные ресурсы не назначены
- id: EXP-002
  tests:
  - HYP-003
  decision: DEC-001
  expected_change: 'discovery: проверить возможность обосновать каждое будущее потребительское
    обещание собственной функцией и прямым свидетельством, совпадающим по сегменту,
    сценарию и поверхности. Результат не получен.'
  metric: Число кандидатов сообщений с подтверждёнными собственной функцией и прямым
    proof / число предложенных кандидатов; исходный статус — unknown, активных сообщений
    нет.
  comparison: Кандидат сообщения сопоставляется с точным действующим собственным документом
    или наблюдением функции. Публичное правило аналога и план EXP подтверждением не
    считаются.
  duration: До активации любого потребительского обещания; срок появления собственных
    материалов неизвестен. Без новых материалов повтор не запускается.
  effort: Только проверка уже разрешённых открытых или собственных материалов. Получение
    доступа, контакты, закупки и живые проверки не разрешены.
  side_effects:
  - Выдать запланированную проверку за готовую функцию.
  - Снять блокировку коммуникации посредством фиктивного PRM.
  stop_go: Предложение к C3, не утверждено. Stop при отсутствии собственной подтверждённой
    функции, отсутствии прямого proof или несовпадении области. Go только если для
    каждого предлагаемого активного сообщения подтверждены функция, область и proof;
    затем новый comms gate, смысловая сверка и предъявление версии на C3. При неизвестности
    — кандидат удерживается, PRM не создаётся. При одновременном stop/go действует
    stop. Никакой исход не разрешает запуск или публикацию.
  status_note: 'CHG-001: HYP-003 относится только к будущей потребительской функции,
    остаётся открытой; текущий CLI её не подтверждает. EXP-002 отложен за предел текущего
    внутреннего пакета, не prerequisite PRM-001. Не исполнялся; порог не изменён.
    Возврат потребует разрешённого нового материала и нового согласования.'
