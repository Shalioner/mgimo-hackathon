- id: CLM-001
  type: fact
  statement: В LSC-CyFair заявка на использование швейной машины не подтверждена до
    официального подтверждения библиотеки.
  evidence:
  - source: SRC-001
    quote: Your request is not confirmed until you receive official confirmation from
      the library.
    locator: Your Sewing Machine Reservation → Before You Arrive; снимок sources/lsc-confirmation.md,
      строка 9
  confidence:
    level: high
    rationale: Первичная открытая страница оператора; точная цитата сверена с живым
      HTTP-текстом и снимком.
  limitations: Только действующее правило названной библиотеки; не свойство «Стежка».
- id: CLM-002
  type: fact
  statement: MakerSpace допускает освобождение забронированной машины при отсутствии
    пользователя через 15 минут после начала записи.
  evidence:
  - source: SRC-002
    quote: If you do not arrive within 15 minutes of the start of your reservation,
      the machine may be released
    locator: Machines & Reservations → How do I reserve a machine?; снимок sources/makerspace-release.md,
      строка 9
  confidence:
    level: high
    rationale: Первичная открытая страница оператора; точная цитата сверена с живым
      HTTP-текстом и снимком.
  limitations: 'Только политика названного оператора: не частота неявок, не наблюдение
    соблюдения и не измерение причинного эффекта.'
- id: CLM-003
  type: fact
  statement: Springvale Library требует вводный инструктаж по безопасности и основам
    работы перед использованием швейной машины.
  evidence:
  - source: SRC-003
    quote: Before using the sewing machine, you’ll need to attend a short induction
      session covering safety and basic operation.
    locator: Sewing Machine Inductions; снимок sources/springvale-induction.md, строка
      9
  confidence:
    level: high
    rationale: Первичная открытая страница оператора; точная цитата сверена с живым
      HTTP-текстом и снимком.
  limitations: Только правило Springvale, не универсальный стандарт и не подтверждённая
    возможность «Стежка».
- id: CLM-004
  type: interpretation
  statement: Публичные правила дают основания различать заявку, подтверждение брони
    и допуск к машине; они ограничивают безусловное обещание доступа, но не описывают
    будущие функции «Стежка».
  derived_from:
  - CLM-001
  - CLM-003
  confidence:
    level: medium
    rationale: Логический вывод из правил разных операторов; переносимость требует
      отдельной проверки.
  limitations: Контрпримеры безусловному обещанию, не данные о спросе и не спецификация
    местной мастерской.
- id: CLM-005
  type: interpretation
  statement: Наличие правила освобождения машины при опоздании не устанавливает распространённость
    неявок и не доказывает, что такое правило снижает их в «Стежке».
  derived_from:
  - CLM-002
  confidence:
    level: high
    rationale: Нормативное правило не содержит измерения частоты, знаменателя или
      причинного сравнения.
  limitations: Вывод о границе конкретного источника; не утверждение об отсутствии
    проблемы.
- id: CLM-006
  type: interpretation
  statement: 'Агент задал 3 класса примеров обещаний: заявка гарантирует машину; запись
    достаточна для допуска; правило снижает неявки. Это не реальные обещания владельца.
    Документарный потолок охвата ALT-001 — 3 из 3 классов; методика ALT-002 адресует
    1 из 3. Расчёт: 2 класса границ доступа + 1 класс причинного обещания = 3. Это
    предел проверки формулировок в выбранном наборе, не прогноз ошибок или сдвига
    продуктовой метрики.'
  derived_from:
  - CLM-004
  - CLM-005
  confidence:
    level: medium
    rationale: Операционализация границ интерпретаций и подсчёт заданных примеров;
      полнота для будущего продукта неизвестна.
  limitations: Набор предложен агентом. Публичные правила не доказывают наличие или
    ошибочность местных обещаний.
- id: CLM-007
  type: interpretation
  statement: 'Условный T0-расчёт HYP-001: веса 0.50, 0.30, 0.20; суммы ALT-001 4.00,
    ALT-002 1.80, ALT-003 2.40, ALT-004 1.90. При весе экономности e и отношении прочих
    весов 5:3: ALT-001 = 4.25 - 1.25e; ALT-003 = 1.75 + 3.25e; ALT-002 = 2 - e; ALT-004
    = 1.375 + 2.625e. Равенство лидеров при e = 5/9, приблизительно 0.5556. При равенстве
    сохраняется ALT-003. Это арифметика допущений, не измеренные эффекты.'
  derived_from:
  - HYP-001
  confidence:
    level: low
    rationale: Арифметика воспроизводима; содержательные веса и баллы остаются допущением.
  limitations: Не денежная экономия, не измеренная стоимость, не эмпирический порог.
- id: CLM-008
  type: fact
  statement: В локальном повторе CLI на заполненном примере записал одну карточку
    Markdown (exit 0); неполный пример отклонил (exit 2) без файла результата. Выход
    заполненного примера побайтно совпал с предоставленным example-result.md.
  evidence:
  - source: SRC-006
    quote: 'Заполненный пример: exit 0, записана одна карточка Markdown; выход совпадает
      побайтно с example-result.md.'
    locator: Проверенный результат, первое предложение
  - source: SRC-006
    quote: 'Неполный пример: exit 2, файл результата отсутствует.'
    locator: Проверенный результат, второе предложение
  confidence:
    level: high
    rationale: Независимый локальный запуск текущим агентом; коды и байты проверены
      кодом.
  limitations: Только локальная CLI-поверхность и заданные входы; не полнота аудита,
    спрос, мастерская или проверка истинности.
- id: CLM-009
  type: fact
  statement: В локальном отрицательном контроле CLI принял заведомо недостоверную,
    но заполненную карточку (exit 0). Реализация проверяет четыре непустых текстовых
    поля; истинность, полнота аудита и пригодность обещания не проверяются.
  evidence:
  - source: SRC-006
    quote: 'Заведомо недостоверная, но заполненная карточка: exit 0, записана без
      проверки истины.'
    locator: Проверенный результат, третье предложение
  - source: SRC-004
    quote: Проверяет лишь наличие четырёх непустых полей. Не проверяет истинность,
      полноту аудита или пригодность обещания.
    locator: Второй абзац README
  - source: SRC-005
    locator: 'Цикл for row in rows: условие set(row) и непустых строк; затем формирование
      Markdown'
  confidence:
    level: high
    rationale: Отрицательный контроль совпал с прочитанной реализацией.
  limitations: Проверены конкретная версия и вход; надёжность на всём домене не установлена.
- id: CLM-010
  type: interpretation
  statement: 'При HYP-004 потолок оценённых затрат труда: 2 часа × 1000 рублей/час
    = 2000 рублей/разбор; при прямом доходе 0 рублей денежный вклад при полном лимите
    равен −2000 рублей/разбор. Это условный бюджет внутреннего исследования; денежная
    безубыточность при положительном труде из данных не следует.'
  derived_from:
  - HYP-004
  confidence:
    level: low
    rationale: 'Арифметика проверена Python: 2*1000=2000; 0-2000=-2000. Драйверы остаются
      сценарными допущениями.'
  limitations: Не оценка фактической стоимости или полезности; стоимость текущего
    native-сеанса сюда не включена.
- id: CLM-011
  type: interpretation
  statement: 'Сценарный расчёт income - hours * rate на один внутренний разбор по
    HYP-004: hours low/base/high = 0/2/2 часа, rate = 1000/1000/1000 рублей/час, income
    = 0/0/0 рублей. Значения результата: pessimistic -2000, base -2000, optimistic
    0 рублей/разбор. Это границы использования лимита, не прогноз: 0 часов означает
    отсутствие работы, а не полезный бесплатный аудит. Денежный ноль при hours = 0;
    при hours > 0 вклад отрицателен. Для base 2 часа потребовался бы income 2000 рублей
    для нуля, но это вне принятого диапазона дохода 0. Топ-3 tornado: hours swing
    2000 рублей; income swing 0; rate swing 0, поскольку последние фиксированы. Лимит
    2 часа является самостоятельным сценарным условием и не порогом денежной безубыточности.'
  derived_from:
  - HYP-004
  - CLM-010
  confidence:
    level: low
    rationale: 'tools/econ.py state/economics.yaml --json и ручная проверка знака:
      d(result)/d(hours)=-1000. Диапазон времени лишь охватывает от отсутствия работы
      до принятого лимита; реальный труд не измерен.'
  limitations: Не прогноз спроса, выручки или немонетарной полезности. Автоматический
    текст econ о смене решения по hours > 0 относится только к цели денежного нуля,
    не отменяет приоритет C2 ограничить недоказанные обещания. Цены и доход зафиксированы
    допущением, поэтому нулевой swing не доказательство низкого риска.
