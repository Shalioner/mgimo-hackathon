- id: ALT-001
  title: Аудит границ обещаний
  kind: change
  description: 'Составить внутреннюю матрицу: пример формулировки — какое собственное
    подтверждение потребуется — что пока неизвестно. Рассмотреть разные состояния
    заявки и допуска по открытым аналогам; никакой публикации, разработки, интеграции
    или бронирования.'
  supported_by:
  - CLM-001
  - CLM-003
  - CLM-004
  - HYP-001
  - CLM-008
  - CLM-009
  - HYP-004
  - CLM-010
  objections:
  - text: Если переносимость CLM-004 переоценена в HYP-001, аудит формальных состояний
      не даст полезного первого решения для «Стежка»; статус-кво предпочтительнее
      дополнительной работы.
    refs: &id001
    - CLM-001
    - CLM-003
    - CLM-004
    - HYP-001
  costs_revenue: 'Единый горизонт: следующее кабинетное действие после C2. Денежные
    затраты, часы, доход и чистый вклад неизвестны; внешних закупок нет, время агента
    не бесплатно по умолчанию. Польза — подготовка решения, не коммерческий эффект.
    Порядковые оценки только HYP-001.

    Пересмотрено по CHG-001: прежняя неизвестность фактических затрат сохраняется;
    HYP-004/CLM-010 задают только условный лимит внутреннего разбора. CLI оформляет
    заполненное, но не заменяет ручной аудит (CLM-008/009). Баллы HYP-001 не пересчитаны
    вверх: измерения пользы и экономии нет.'
  scores:
    польза:
      value: 5
      rationale: Порядковое допущение агента из HYP-001, не измеренный эффект или
        стоимость.
      refs: *id001
    переносимость:
      value: 3
      rationale: Порядковое допущение агента из HYP-001, не измеренный эффект или
        стоимость.
      refs: *id001
    экономность:
      value: 3
      rationale: Порядковое допущение агента из HYP-001, не измеренный эффект или
        стоимость.
      refs: *id001
  status_note: 'CHG-001: готовый локальный CLI остаётся вспомогательной поверхностью
    ALT-001. Отдельный синтетический C2 сохраняет вариант и принимает HYP-004; C3
    открыт, разработка и интеграция не предлагаются.'
