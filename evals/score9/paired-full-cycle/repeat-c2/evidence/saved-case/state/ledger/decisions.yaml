  rationale: '# Повторный выбор по сортировке возвратов


    ## Главное


    Исправленная сводка того же пилота даёт +2 п.п. правильной приёмки при минимуме
    +5 п.п. и 7% обращений с подсказкой при пороге вреда 5% [CLM-003] [CLM-018] [CLM-019].

    Оба сигнала требуют пересмотра [DEC-001] [CHG-001]. Работы по подготовке проверки
    подсказки и её расширение приостановлены.

    На ближайшую учебную неделю рекомендую оставить текущий экран и сохранить инициативу
    открытой [ALT-003]. Уверенность высокая в срабатывании порогов по наблюдаемым
    долям, средняя в выборе дальнейшего направления.


    ## Прежнее основание


    По первоначальной сводке [SRC-002] подсказка дала +8 п.п. правильной приёмки (72%
    → 80%) и 3% обращений при 2% в контроле [CLM-010] [CLM-011]. Обе точечные оценки
    проходили пороги, хотя интервалы пересекали их. Стенд подтвердил, что после ручного
    подтверждения зоны можно сверить её код на экране [CLM-012]. Руководитель выбрал
    подготовку ограниченной проверки на одном складе [ALT-001] [DEC-001], затем утвердил
    пакет подготовки на C3. Для реальных смен нужен отдельный допуск руководителя
    продукта и начальника склада [CLM-005].


    ## Что изменила поправка


    Аудит сообщил о возможной подмене фактической зоны зоной назначения и о пропущенной
    связи с обращениями со второго экрана. После сверки по идентификатору операции
    исправленная сводка [SRC-005] заменила исходную по обеим метрикам [SRC-004] [CLM-015].
    Когорта, склад, ветки и окно прежние. В каждой ветке по 300 операторов, у каждого
    учитывается первый подходящий короб и оба исхода за 24 часа [CLM-002] [CLM-006]
    [CLM-016] [CLM-017]. По заявленной аудитором полноте пропуски составляют 0 из
    600 (0%).


    | Метрика | Прежняя сводка | Исправленная сводка | Порог |

    |---|---|---|---|

    | Правильная приёмка без повторной маркировки | 216/300 (72%) → 240/300 (80%),
    +8 п.п. [CLM-010] | 216/300 (72%) → 222/300 (74%), +2 п.п. [CLM-018] | Минимум
    +5 п.п. к контролю. Выигрыш ниже порога [CLM-003]. |

    | Хотя бы одно обращение к начальнику смены по той же операции | 6/300 (2%) →
    9/300 (3%), +1 п.п. [CLM-011] | 6/300 (2%) → 21/300 (7%), +5 п.п. [CLM-019] |
    Вред при абсолютной доле в тесте выше 5%. Порог превышен [CLM-003]. |


    95% интервал для прироста правильной приёмки составляет от −5,1 до +9,1 п.п. Отдельный
    95% интервал для абсолютной доли обращений с подсказкой составляет 4,6–10,5% [CLM-018]
    [CLM-019]. Точный размер эффекта неопределён. По правилу кейса для паузы достаточно
    наблюдаемого сигнала вреда [CLM-003]. Неизвестно, в каких сценариях возникают
    ошибки и дополнительные обращения. Сводка агрегирована. Для ответа нужна сверка
    исходов по сценариям и этапам операции.


    Смета учебных работ составляет 36 000 ₽ при потолке 50 000 ₽. Стоимость повторной
    маркировки неизвестна [CLM-004]. Стендовое наблюдение и ограничения допуска применимы
    и после поправки [CLM-005] [CLM-012] [CLM-015]. Для следующей версии пакета нужно
    пересмотреть обоснование вариантов и EXP-001, а также область применения сообщения
    PRM-001. Прямое наблюдение о показе кода сохраняет доказательность в пределах
    стенда.


    ## Выбор на учебную неделю


    Правило выбора задано порогами пользы и вреда и ограничениями подготовки и допуска
    [CLM-003] [CLM-004] [CLM-005]. Сигнал вреда приостанавливает расширение.


    | Вариант | Польза, вред и выполнимость | Сильное возражение |

    |---|---|---|

    | [ALT-001] Подготовить проверку подсказки | +2 п.п. пользы и 7% обращений. Стенд
    подтверждает показ кода. На реальные смены нужен отдельный допуск [CLM-005] [CLM-012]
    [CLM-018] [CLM-019]. | Продолжение прежней подготовки расходует ресурс на вариант,
    который по наблюдаемым долям провалил оба критерия. |

    | [ALT-002] Подготовить изменение этикетки | Польза, вред и затраты на эту меру
    неизвестны. С операторами этикетку ещё не проверяли [CLM-001] [CLM-004]. | Если
    ошибка возникает при выборе зоны, этикетка может закрепить ошибочный код [HYP-002].
    |

    | [ALT-003] Оставить текущий экран и сохранить инициативу открытой | Контроль
    дал 72% правильной приёмки и 2% обращений. Подготовка изменения на этой неделе
    не требуется [CLM-016]. | Сохраняются сбои действующей сортировки. Пауза откладывает
    потенциальное улучшение [CLM-018] [PAIN-001]. |

    | [ALT-004] Остановить инициативу и вернуть ресурс команде | Действующая сортировка
    продолжается, ресурс подготовки освобождается. Выгода его альтернативного применения
    неизвестна [ALT-004]. | Закрытие откладывает и разбор причин ошибок, и возможность
    проверить этикетку, для которой данных пока нет [CLM-001] [PAIN-001]. |


    Рекомендация [ALT-003] оставляет возможность вернуться к улучшению. Пересмотр
    стоит привязать к данным о причинах сбоев и сопоставимой проверке кандидата по
    тем же порогам. До решения текущая сортировка идёт на действующем экране. После
    C2 пакет обновляется для нового C3.


    Какой вариант на ближайшую учебную неделю выбираете на повторном C2 [DEC-001]
    [CHG-001]?'
