      экране. Пересчёт проверил каждую запись по идентификатору исходной операции.
  - source: SRC-004
    locator: строка 5
    quote: Это те же операторы, ветки, склад и 24-часовое окно. Итоговая сводка полная.
      Смета, критерии решения, ограничения допуска и наблюдение на учебном стенде
      остаются действующими.
  confidence:
