  derived_from: [CLM-007, CLM-008, CLM-010]
  confidence: {level: high, rationale: "Это верхняя граница доли, рассчитанная от наблюдаемого контроля."}
  limitations: "Потолок одинаков для любых изменений этой метрики и не является прогнозом эффекта."
- id: CLM-014
  type: interpretation
  statement: "При плановой контрольной доле 72% и MDE +5 п.п. до 77%, двустороннем уровне значимости 5% и мощности 80% расчёт tools/power.py требует 1192 оператора с завершёнными исходами на ветку, 2384 всего."
