- id: CLM-010
  type: interpretation
  statement: "Правильная приёмка без повторной маркировки: 216/300 = 72% в контроле и 240/300 = 80% с подсказкой. Разница +8 п.п. проходит точечный порог +5 п.п. Двусторонний 95% интервал Ньюкомба для разницы от +1,2 до +14,7 п.п. включает +5 п.п."
  derived_from: [CLM-002, CLM-003, CLM-006, CLM-007, CLM-008, CLM-009]
  confidence: {level: medium, rationale: "Доли пересчитаны из полных по протоколу агрегатов. Интервал отражает неопределённость эффекта."}
  limitations: "Один склад и только первый подходящий короб. Нижняя граница интервала ниже практического порога."
- id: CLM-011
  type: interpretation
  statement: "К начальнику смены обращались 6/300 = 2% в контроле и 9/300 = 3% с подсказкой. Разница +1 п.п. (двусторонний 95% интервал Ньюкомба от −1,7 до +3,8 п.п.). Наблюдаемые 3% не превышают порог 5%. Двусторонний 95% интервал Уилсона для доли теста от 1,6% до 5,6% включает порог."
  derived_from: [CLM-002, CLM-003, CLM-006, CLM-007, CLM-008, CLM-009]
  confidence: {level: medium, rationale: "Порог сравнивается с абсолютной долей в тесте. Малое число обращений оставляет неопределённость."}
