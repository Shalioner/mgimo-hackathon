- id: ALT-001
  title: "Подготовить проверку экранной подсказки на одном складе"
  kind: change
  description: "Подготовить материалы и проверить на стенде показ кода вручную подтверждённой зоны перед закрытием. Реальные смены требуют отдельного допуска."
  supported_by: [CLM-003, CLM-004, CLM-005, CLM-010, CLM-011, CLM-012, CLM-013]
  objections:
    - text: "Вывод о достижении порога пользы держится на точечной оценке. Интервалы допускают и выигрыш ниже цели, и долю обращений выше порога."
      refs: [CLM-010, CLM-011]
  costs_revenue: "Смета учебных работ укладывается в заданный потолок, цену варианта нужно уточнить. Экономия неизвестна."
- id: ALT-002
  title: "Подготовить изменение печатной этикетки"
  kind: change
  description: "Подготовить макет маркировки на коробе для проверки читаемости и передачи зоны при сортировке."
  supported_by: [CLM-001, CLM-005, CLM-013, HYP-001, HYP-002]
  objections:
    - text: "Если ошибка возникает при выборе зоны до печати, этикетка может передать ошибочный код дальше по цепочке."
      refs: [HYP-002]
  costs_revenue: "Затраты на макет, печать и применение отдельно не оценены. Экономия неизвестна."
- id: ALT-003
  title: "Оставить текущий экран"
  kind: status_quo
  description: "Сохранить действующую сортировку и отложить подготовку изменения на учебную неделю. Инициативу сохранить открытой."
  supported_by: [CLM-007, CLM-008, CLM-010, CLM-011]
  objections:
    - text: "Если наблюдаемый прирост воспроизводится, перенос проверки сохраняет потери от текущего процесса ещё на учебную неделю."
      refs: [CLM-010]
  costs_revenue: "Подготовка изменений не нужна. Текущая стоимость повторной маркировки неизвестна."
- id: ALT-004
  title: "Остановить инициативу и вернуть ресурс команде"
  kind: kill
  description: "Прекратить подготовку обеих мер и вернуть ресурс для других задач. Действующий процесс сортировки продолжается."
  supported_by: [CLM-001, CLM-004, CLM-010, CLM-011]
  objections:
    - text: "Если экранный эффект воспроизводится, прекращение инициативы откладывает проверку решения с измеренным сигналом пользы."
      refs: [CLM-010]
  costs_revenue: "Высвобождается ресурс подготовки. Выгода его альтернативного применения неизвестна."
