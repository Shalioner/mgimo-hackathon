- id: HYP-001
  kind: assumption
  statement: Для сравнения действий применимы единые определения пользы и вреда на
    уровне оператора с первым подходящим коробом.
  based_on:
  - CLM-002
  - CLM-003
  - CLM-007
  confidence:
    level: medium
    rationale: Определения едины для веток пилота. Измеримость для этикетки требует
      отдельной проверки.
  would_change_decision: true
- id: HYP-002
  kind: hypothesis
  statement: Видимый код до закрытия устраняет часть ошибок чтения зоны при ручном
    подтверждении. Если ошибки происходят главным образом после закрытия, физическая
    этикетка может влиять на них сильнее.
  based_on:
  - CLM-001
  - CLM-006
  - CLM-012
  - CLM-017
  - CLM-018
  confidence:
    level: low
    rationale: Сигнал пользы слабее. Агрегаты не раскрывают этап ошибок и причину
      обращений.
  would_change_decision: true
  verdict: open
  status_note: Пересмотрено по CHG-001. Механизм ошибки и эффект этикетки остаются
    открытыми.
- id: HYP-003
  kind: assumption
  statement: Для расчёта выборки контрольная доля 72% из предыдущего учебного пилота
    используется как плановая. Расчёт двусторонний, уровень значимости 5%, мощность
    80%, распределение поровну.
  based_on:
  - CLM-003
  - CLM-008
  confidence:
    level: medium
    rationale: Историческая база измерена, параметры мощности предложены для плана.
  would_change_decision: true
  status_note: Проверено по CHG-001. Контрольная доля совпадает с исходной.
