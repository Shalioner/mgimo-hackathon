- id: EXP-001
  status_note: "Пересмотрено по CHG-001. Подсказка на паузе по сигналу исходного пилота. Будущий EXP-001 не проведён. Для возможного возврата сохранены окно, пороги и расчётный набор. Стендовая диагностика должна сверить фактическую зону и обращения с обоих экранов по идентификатору операции."
  decision: DEC-001
  tests: [HYP-001, HYP-002, HYP-003]
  expected_change: "После допуска причинная проверка оценивает прирост правильной приёмки без повторной маркировки. Сопоставимость исходов проверяется на стенде, этапы сбоев разбираются по журналу, плановая база сверяется с наблюдаемой контрольной долей."
  metric: "Правильная приёмка без повторной маркировки / все назначенные операторы ветки. Хотя бы одно обращение к начальнику смены по той же операции / все назначенные операторы ветки."
  comparison: "Случайное назначение операторов на одном складе. Контроль — текущий экран, тест — код вручную подтверждённой зоны перед закрытием. Анализ по назначению, один первый подходящий закрытый короб на оператора."
  duration: "Окно исходов 24 часа для первого подходящего закрытого короба. Срок набора устанавливается по доступности операторов до допуска на реальные смены."
  effort: "Подготовка на ближайшую учебную неделю. Смета учебных работ 36 000 ₽, потолок 50 000 ₽ [CLM-004]. Отдельная смета будущих смен неизвестна."
  side_effects: ["Рост обращений к начальнику смены", "Показ неверного кода или показ без подтверждения", "Задержка закрытия и повторная маркировка"]
  stop_go: "Stop: доля обращений в тесте >5% означает паузу расширения до отдельного решения даже при одновременном выигрыше. При полных данных прирост <+5 п.п. означает остановку продвижения варианта. Go: при полных данных прирост ≥+5 п.п. и доля обращений ≤5%, интервалы целиком в допустимых областях, затем отдельный разбор перед расширением. При пересечении границ интервалами или неполных данных — пауза, добор/разбор, без расширения."
  owner: "Руководитель складского интерфейса"
