- id: CLM-001
  type: fact
  statement: "Руководитель складского интерфейса выбирает действие на ближайшую учебную неделю: сохранить текущий экран, проверить подсказку на одном складе, изменить печатную этикетку или остановить инициативу и вернуть ресурс команде. Этикетку с операторами ещё не проверяли."
  evidence:
    - source: SRC-001
      locator: "строка 3"
  confidence: {level: high, rationale: "Прямо задано в постановке учебного кейса."}
- id: CLM-002
  type: fact
  statement: "В учебном пилоте на одном складе назначение и анализ проводились на уровне оператора с первым подходящим закрытым коробом возврата. Оба исхода измерялись в течение 24 часов. Единицу назначения и окно наблюдения менять нельзя."
  evidence:
    - source: SRC-001
      locator: "строки 5 и 7"
  confidence: {level: high, rationale: "Единица и окно явно описаны в протоколе."}
- id: CLM-003
  type: fact
  statement: "Порог пользы — прирост доли коробов, принятых в правильной зоне без повторной маркировки, минимум на 5 процентных пунктов против контроля. Порог вреда — обращение к начальнику смены более чем у 5% операторов тестовой ветки. Сигнал вреда приостанавливает расширение до отдельного решения."
  evidence:
    - source: SRC-001
      locator: "строки 7 и 9"
  confidence: {level: high, rationale: "Пороговые условия прямо заданы в учебных материалах."}
- id: CLM-004
  type: fact
  statement: "Смета работ на следующую учебную неделю — 36 000 ₽ при потолке 50 000 ₽. Стоимость повторной маркировки на короб не измеряли."
  evidence:
    - source: SRC-001
      locator: "строка 9"
  confidence: {level: high, rationale: "Явно указанные смета, потолок и пробел в данных."}
- id: CLM-005
  type: fact
  statement: "До отдельного согласования руководителем продукта и начальником склада разрешены подготовка материалов и стендовая проверка. Подсказка предназначена для внутреннего экрана и не должна обещать автоматический выбор зоны или отсутствие ошибок."
  evidence:
    - source: SRC-001
      locator: "строка 11"
  confidence: {level: high, rationale: "Порядок допуска и ограничения обещаний указаны в учебной постановке."}
- id: CLM-006
  type: fact
  statement: "Учебный пилот 9–15 ноября 2026 года проведён на одном складе со случайным распределением операторов. Типы подходящих возвратов совпадали. Контроль использовал текущий экран. В тесте при ручном подтверждении зоны перед закрытием показывался её код."
  evidence:
    - source: SRC-001
      locator: "строка 5"
  confidence: {level: high, rationale: "Дизайн прямо описан в учебном протоколе."}
- id: CLM-007
  type: fact
  statement: "По протоколу сводка охватывает всех назначенных операторов с завершённым окном, без пропусков и дублей. Польза — короб принят в правильной зоне без повторной маркировки. Вред — оператор хотя бы раз обратился к начальнику смены по той же операции. Окно обоих исходов — 24 часа."
  evidence:
    - source: SRC-001
      locator: "строка 7"
  confidence: {level: high, rationale: "Это описание полноты и исходов в учебном протоколе."}
  limitations: "В агрегатах нет строк операторов для независимой проверки полноты и дублей."
- id: CLM-008
  type: fact
  statement: "Контроль: назначено 300 операторов, правильная приёмка без повторной маркировки — 216, обращение к начальнику смены — 6."
  evidence:
    - source: SRC-002
      locator: "строка control, столбцы assigned, correct_without_rework, asked_supervisor"
  confidence: {level: high, rationale: "Числа напрямую прочитаны из CSV."}
- id: CLM-009
  type: fact
  statement: "Подсказка: назначено 300 операторов, правильная приёмка без повторной маркировки — 240, обращение к начальнику смены — 9."
  evidence:
    - source: SRC-002
      locator: "строка zone_hint, столбцы assigned, correct_without_rework, asked_supervisor"
  confidence: {level: high, rationale: "Числа напрямую прочитаны из CSV."}
- id: CLM-010
  type: interpretation
  statement: "Правильная приёмка без повторной маркировки: 216/300 = 72% в контроле и 240/300 = 80% с подсказкой. Разница +8 п.п. проходит точечный порог +5 п.п. Двусторонний 95% интервал Ньюкомба для разницы от +1,2 до +14,7 п.п. включает +5 п.п."
  derived_from: [CLM-002, CLM-003, CLM-006, CLM-007, CLM-008, CLM-009]
  confidence: {level: medium, rationale: "Доли пересчитаны из полных по протоколу агрегатов. Интервал отражает неопределённость эффекта."}
  limitations: "Один склад и только первый подходящий короб. Нижняя граница интервала ниже практического порога."
- id: CLM-011
  type: interpretation
  statement: "К начальнику смены обращались 6/300 = 2% в контроле и 9/300 = 3% с подсказкой. Разница +1 п.п. (двусторонний 95% интервал Ньюкомба от −1,7 до +3,8 п.п.). Наблюдаемые 3% не превышают порог 5%. Двусторонний 95% интервал Уилсона для доли теста от 1,6% до 5,6% включает порог."
  derived_from: [CLM-002, CLM-003, CLM-006, CLM-007, CLM-008, CLM-009]
  confidence: {level: medium, rationale: "Порог сравнивается с абсолютной долей в тесте. Малое число обращений оставляет неопределённость."}
- id: CLM-012
  type: fact
  statement: "На локальном учебном стенде после ручного подтверждения зоны перед закрытием показан совпадающий код. При повторе без подтверждённой зоны код не появился."
  evidence:
    - source: SRC-003
      locator: "строки 5–8, сценарии A и B"
  confidence: {level: high, rationale: "В протоколе есть прямое наблюдение в обоих сценариях."}
  limitations: "Стенд фиксировал появление кода. Скорость, ошибки и переносимость на другие склады не измерялись."
- id: CLM-013
  type: interpretation
  statement: "Арифметический потолок прироста правильной приёмки относительно 72% контроля составляет +28 п.п. до 100%, если все 84 из 300 недостигнутых исходов исправить. Доля случаев, на которые способны повлиять подсказка и этикетка, неизвестна."
  derived_from: [CLM-007, CLM-008, CLM-010]
  confidence: {level: high, rationale: "Это верхняя граница доли, рассчитанная от наблюдаемого контроля."}
  limitations: "Потолок одинаков для любых изменений этой метрики и не является прогнозом эффекта."
