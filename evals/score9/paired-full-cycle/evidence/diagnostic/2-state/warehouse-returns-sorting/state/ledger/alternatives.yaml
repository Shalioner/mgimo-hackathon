- id: ALT-001
  title: Оставить текущий экран как есть
  kind: status_quo
  description: Сохранить текущий экран и процесс возвратов, не готовить новую проверку на ближайшую неделю. Вернуться к инициативе при новых основаниях.
  supported_by: [CLM-002, CLM-007, CLM-009]
  objections:
    - text: Если выигрыш из CLM-009 повторится, сохранение текущего экрана оставит доступное улучшение непроверенным.
      refs: [CLM-009]
  costs_revenue: Новая подготовка не требуется. Текущая стоимость повторной маркировки неизвестна (CLM-004).
- id: ALT-002
  title: Подготовить повторную проверку подсказки с кодом зоны на одном складе
  kind: change
  description: Подготовить на стенде показ кода вручную подтверждённой зоны перед закрытием и материалы сопоставимой проверки на одном складе. Запуск на реальных сменах требует отдельного согласования.
  supported_by: [CLM-003, CLM-005, CLM-006, CLM-009, CLM-010, CLM-011, CLM-012, HYP-001]
  objections:
    - text: Если сигнал пользы CLM-009 не повторится или обращения из CLM-010 вырастут выше порога, затраты на подготовку не дадут основания для расширения.
      refs: [CLM-009, CLM-010]
  costs_revenue: Общая смета укладывается в потолок (CLM-012), объём подготовки нужно сверить со сметой. Экономия неизвестна (CLM-004).
- id: ALT-003
  title: Подготовить изменение печатной этикетки на коробе
  kind: change
  description: Подготовить макет и проверку читаемости кода на коробе, затем сравнить с текущей этикеткой при одинаковом экране.
  supported_by: [CLM-001, CLM-013, HYP-002]
  objections:
    - text: Если HYP-002 неверна и сбой возникает до закрытия короба, смена этикетки может оставить причину без изменения.
      refs: [HYP-002]
  costs_revenue: Сметы на дизайн, печать и изменение процесса нет. Частота затрагиваемых случаев и экономия неизвестны.
- id: ALT-004
  title: Остановить инициативу и вернуть ресурс команде
  kind: kill
  description: Закрыть работу над изменением сортировки в этом цикле и освободить ресурс команды для других задач.
  supported_by: [CLM-004, CLM-009, CLM-011]
  objections:
    - text: Если эффект CLM-009 подтвердится повторно, закрытие инициативы лишит команду возможности быстро проверить уже наблюдавшуюся пользу.
      refs: [CLM-009]
  costs_revenue: Ресурс возвращается команде. Ценность альтернативной загрузки и упущенная экономия неизвестны.
