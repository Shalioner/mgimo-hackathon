- id: CLM-001
  type: fact
  statement: Руководитель складского интерфейса выбирает, какую проверку готовить на ближайшую учебную неделю. Печатная этикетка ещё не проверена с операторами.
  evidence:
    - source: SRC-001
      locator: 'строка 3'
  confidence:
    level: high
    rationale: Прямо задано условиями учебного кейса.
- id: CLM-002
  type: fact
  statement: Единица назначения и анализа — оператор с первым подходящим закрытым коробом. Окно наблюдения — 24 часа. Контроль использовал текущий экран.
  evidence:
    - source: SRC-001
      locator: 'строки 5 и 7'
  confidence:
    level: high
    rationale: Дизайн пилота и определения исходов описаны в брифе.
- id: CLM-003
  type: fact
  statement: Порог пользы — как минимум +5 процентных пунктов принятия в правильной зоне без повторной маркировки против контроля. Порог вреда — обращения к начальнику смены у более 5% операторов тестовой ветки. Превышение порога вреда приостанавливает расширение до отдельного решения.
  evidence:
    - source: SRC-001
      locator: 'строки 7 и 9'
  confidence:
    level: high
    rationale: Пороги и действие при превышении заданы условиями учебного кейса.
- id: CLM-004
  type: fact
  statement: Смета работ на следующую учебную неделю — 36 000 ₽ при потолке 50 000 ₽. Стоимость повторной маркировки на короб не измеряли.
  evidence:
    - source: SRC-001
      locator: 'строка 9'
  confidence:
    level: high
    rationale: Смета, потолок и пробел в данных указаны прямо.
- id: CLM-005
  type: fact
  statement: До отдельного согласования с руководителем продукта и начальником склада допустимы подготовка материалов и стендовая проверка. Подсказка предназначена для внутреннего экрана операторов. Обещания автоматического выбора зоны и отсутствия ошибок исключены.
  evidence:
    - source: SRC-001
      locator: 'строка 11'
  confidence:
    level: high
    rationale: Условия запуска и рамки сообщения заданы учебным брифом.
- id: CLM-006
  type: fact
  statement: На стенде перед закрытием короба отображался код вручную подтверждённой зоны. Без подтверждения зоны подсказка не появлялась.
  evidence:
    - source: SRC-003
      locator: 'сценарии A и B, строки 5–6'
  confidence:
    level: high
    rationale: Оба результата записаны в стендовом протоколе.
  limitations: Проверка подтверждает отображение и условие появления подсказки в описанных сценариях.
- id: CLM-007
  type: fact
  statement: В контрольной ветке назначены 300 операторов. Зафиксированы 216 принятий без повторной маркировки в правильной зоне и 6 операторов с обращением к начальнику смены.
  evidence:
    - source: SRC-002
      quote: 'control,300,216,6'
  confidence:
    level: high
    rationale: Значения записаны в строке control исходной таблицы.
- id: CLM-008
  type: fact
  statement: В ветке с подсказкой назначены 300 операторов. Зафиксированы 240 принятий без повторной маркировки в правильной зоне и 9 операторов с обращением к начальнику смены.
  evidence:
    - source: SRC-002
      quote: 'zone_hint,300,240,9'
  confidence:
    level: high
    rationale: Значения записаны в строке zone_hint исходной таблицы.
- id: CLM-009
  type: interpretation
  statement: Доля принятий в правильной зоне без повторной маркировки за 24 часа составила 72% (216/300) в контроле и 80% (240/300) с подсказкой. Разность +8 п.п. достигает минимума +5 п.п. в этом пилоте.
  derived_from: [CLM-002, CLM-003, CLM-007, CLM-008]
  confidence:
    level: high
    rationale: Точные отношения исходных счётчиков к числу назначенных в каждой ветке.
  limitations: Точечная оценка для пилота на одном учебном складе.
- id: CLM-010
  type: interpretation
  statement: Доля операторов с обращением к начальнику смены за 24 часа составила 2% (6/300) в контроле и 3% (9/300) с подсказкой. Разность +1 п.п. Абсолютная доля в тесте ниже порога вреда более 5% операторов тестовой ветки.
  derived_from: [CLM-002, CLM-003, CLM-007, CLM-008]
  confidence:
    level: high
    rationale: Доли вычислены по всем назначенным в каждой ветке, порог сопоставлен с долей теста.
  limitations: Точечная оценка для пилота на одном учебном складе.
- id: CLM-011
  type: fact
  statement: Пилот прошёл 9–15 ноября 2026 года на одном учебном складе со случайным распределением операторов, одинаковыми типами подходящих возвратов и завершённым окном наблюдения. По описанию источника в сводке нет пропущенных исходов и дублей.
  evidence:
    - source: SRC-001
      locator: 'строки 5 и 7'
  confidence:
    level: high
    rationale: Условия исследования прямо описаны в сопроводительном материале.
  limitations: Сводка по веткам позволяет проверить агрегаты. Индивидуальные назначения, дубли и полноту исходов независимо проверить нельзя без таблицы по операторам.
- id: CLM-012
  type: interpretation
  statement: Заявленная недельная смета 36 000 ₽ ниже потолка 50 000 ₽ на 14 000 ₽.
  derived_from: [CLM-004]
  confidence:
    level: high
    rationale: Разность потолка и заявленной сметы.
  limitations: Состав сметы и разбивка по вариантам отсутствуют.
- id: CLM-013
  type: interpretation
  statement: У 84 из 300 операторов контроля (28%) составной исход принятия в правильной зоне без повторной маркировки за 24 часа не наступил.
  derived_from: [CLM-002, CLM-007, CLM-009]
  confidence:
    level: high
    rationale: Дополнение к числу и доле успешных операций в контроле.
  limitations: Сводка не показывает отдельную частоту ошибок зоны, повторной маркировки или позднего принятия.
