- id: PAIN-001
  segment: Операторы возвратов на учебном складе
  statement: Часть первых подходящих коробов при текущем экране не достигает исхода «принят в правильной зоне без повторной маркировки за 24 часа».
  criteria:
    frequency:
      level: medium
      basis: [CLM-013]
      note: Наблюдаемая частота составного исхода относится к контролю пилота.
    cost:
      level: unknown
      basis: [CLM-004]
      note: Стоимость повторной маркировки на короб не измеряли.
    workarounds:
      level: unknown
      basis: [CLM-010]
      note: Известно число обращений к начальнику смены, совпадение обращений с неуспехами и другие способы исправления не зафиксированы.
    gap:
      level: medium
      basis: [CLM-009, CLM-013]
      note: В контроле сохраняется доля операций без нужного исхода, причины по этапам не разделены.
    measurability:
      level: high
      basis: [CLM-002, CLM-007, CLM-008]
      note: Составной исход и обращения определены и посчитаны по веткам.
