- id: DEC-001
  question: Что готовить на ближайшую учебную неделю для сортировки возвратов?
  options: [ALT-001, ALT-002, ALT-003, ALT-004]
  criteria:
    - Сначала применить порог вреда, условие допуска и потолок затрат.
    - Среди допустимых вариантов предпочесть подготовку с лучшим подтверждённым сигналом пользы и возможностью сопоставимой проверки.
    - Пересмотреть рекомендацию при превышении порога вреда, отсутствии минимального выигрыша при повторной проверке или неподтверждённой смете.
  state: proposed
  recommended: ALT-002
  rationale: Наблюдаемая польза проходит минимум, доля обращений остаётся ниже порога вреда, стенд подтвердил поведение подсказки. Рекомендация ограничена подготовкой. Состав сметы и повторяемость эффекта предстоит подтвердить.
  based_on: [CLM-003, CLM-004, CLM-005, CLM-006, CLM-009, CLM-010, CLM-011, CLM-012, HYP-001, HYP-002]
