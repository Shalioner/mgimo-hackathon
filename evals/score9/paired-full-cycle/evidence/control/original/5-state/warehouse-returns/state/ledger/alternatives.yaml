- id: ALT-001
  title: Подготовить проверку экранной подсказки на одном складе
  kind: invest
  description: Подготовить материалы и пройти стендовый сценарий на ближайшей учебной неделе. Проверка на реальных сменах требует отдельного согласования.
  supported_by: [CLM-006, CLM-007, CLM-011]
  status_note: По CHG-001 утратил приоритет. Сработал Stop по обращениям, точечный выигрыш ниже минимума.
  objections:
    - text: Исправленный пилот даёт выигрыш ниже порога и долю обращений выше допуска. Повтор с той же подсказкой рискует воспроизвести дополнительную нагрузку.
      refs: [CLM-004, CLM-016, CLM-017]
- id: ALT-002
  title: Подготовить изменение печатной этикетки
  kind: change
  description: Подготовить макет и сценарий проверки чтения кода при перемещении короба после закрытия.
  supported_by: [CLM-001, CLM-007, CLM-011, HYP-002]
  objections:
    - text: Если гипотеза об ошибках при чтении короба неверна, смена этикетки сохранит ошибки выбора зоны и потребует отдельной подготовки без сопоставимого пилотного основания.
      refs: [HYP-002, CLM-001]
- id: ALT-003
  title: Оставить текущий экран
  kind: status_quo
  description: Сохранить рабочий процесс и инициативу открытой, отложить подготовку изменений на эту неделю.
  supported_by: [CLM-002, CLM-004, CLM-015, CLM-016]
  status_note: Рекомендован по CHG-001 как обратимый вариант на неделю.
  objections:
    - text: Текущий процесс сохраняет неуспешные исходы и откладывает проверку возможного выигрыша подсказки. Интервал качества оставляет такой эффект возможным.
      refs: [CLM-015, CLM-017, HYP-001]
- id: ALT-004
  title: Остановить инициативу и вернуть ресурс
  kind: kill
  description: Прекратить работу над сортировкой в рамках инициативы и вернуть ресурс в общий план команды. Операционный процесс сохраняется.
  supported_by: [CLM-001, CLM-016, CLM-011]
  status_note: По CHG-001 довод против подсказки усилился. Сравнительной оценки возврата ресурса по-прежнему нет.
  objections:
    - text: Если альтернативный вклад возвращённого ресурса мал, закрытие прерывает поиск способа исправить сортировку при сохранении текущих издержек.
      refs: [CLM-015, CLM-011]
