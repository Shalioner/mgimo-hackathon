- id: PAIN-001
  segment: Операторы возвратов учебного склада
  statement: Часть коробов не проходит приёмку в правильной зоне без повторной маркировки. При затруднении операторы обращаются к начальнику смены.
  criteria:
    frequency: {level: medium, basis: [CLM-008, CLM-009], note: Причины неуспешных исходов не размечены}
    cost: {level: unknown, basis: [CLM-005], note: Стоимость повторной маркировки не измеряли}
    workarounds: {level: medium, basis: [CLM-003, CLM-008], note: Обращения фиксировали. Результат помощи неизвестен}
    gap: {level: medium, basis: [CLM-007, CLM-009, CLM-010], note: Неуспешные исходы есть и с подсказкой}
    measurability: {level: high, basis: [CLM-002, CLM-003], note: Исходы фиксируются по оператору и его первому подходящему коробу}
