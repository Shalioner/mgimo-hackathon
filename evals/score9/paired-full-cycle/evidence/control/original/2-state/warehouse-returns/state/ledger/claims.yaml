- id: CLM-001
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: В учебном кейсе руководитель складского интерфейса выбирает работу на ближайшую неделю из четырёх вариантов. Печатную этикетку с операторами ещё не проверяли.
  evidence:
    - source: SRC-001
      locator: строка 3
- id: CLM-002
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Пилот на одном складе сравнивал текущий экран с подсказкой кода вручную подтверждённой зоны перед закрытием. Операторов случайно распределили по веткам. Единица назначения и анализа — оператор с первым подходящим закрытым коробом. Правила отбора коробов совпадали в обеих ветках.
  evidence:
    - source: SRC-001
      locator: строка 5
- id: CLM-003
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: За 24 часа фиксировали принятие короба в правильной зоне без повторной маркировки и факт хотя бы одного обращения к начальнику смены по той же операции. Сводка включает всех распределённых операторов, окно завершено у каждого, пропусков и дублей нет.
  evidence:
    - source: SRC-001
      locator: строка 7
    - source: SRC-002
      locator: строки 1–3, сводные счётчики по веткам
- id: CLM-004
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Минимальный выигрыш — +5 процентных пунктов принятия без повторной маркировки против контроля. Если к начальнику смены обращаются более 5% операторов тестовой ветки, расширение приостанавливают до отдельного решения.
  evidence:
    - source: SRC-001
      locator: строки 7 и 9
- id: CLM-005
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Смета на ближайшую учебную неделю — 36 000 ₽ при потолке 50 000 ₽. Стоимость повторной маркировки одного короба не измеряли.
  evidence:
    - source: SRC-001
      locator: строка 9
- id: CLM-006
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Подготовка материалов и стендовая проверка допустимы до запуска на реальных сменах. Для запуска требуется отдельное согласование руководителя продукта и начальника склада. Обещания автоматического выбора зоны или отсутствия ошибок исключены.
  evidence:
    - source: SRC-001
      locator: строка 11
- id: CLM-007
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: На учебном стенде подсказка показала перед закрытием код вручную подтверждённой зоны. Без подтверждённой зоны подсказка отсутствовала.
  evidence:
    - source: SRC-003
      locator: сценарии A и B, строки 5–6
  limitations: Протокол не измеряет скорость, число ошибок или переносимость на другие склады.
- id: CLM-008
  type: fact
  statement: Контроль — 300 назначенных, 216 коробов приняты без повторной маркировки в правильной зоне, 6 обращавшихся операторов. Подсказка — 300 назначенных, 240 таких коробов и 9 обращавшихся операторов.
  evidence:
    - source: SRC-002
      locator: строки 2–3, arm, assigned, correct_without_rework и asked_supervisor
  confidence: {level: high, rationale: Прямая сверка ячеек сводки и диапазонов счётчиков}
- id: CLM-009
  type: interpretation
  statement: 'Пересчёт по всем назначенным: правильная сортировка 216/300 = 72% и 240/300 = 80%, разница +8 п.п. Обращения 6/300 = 2% и 9/300 = 3%, разница +1 п.п. Обе точечные оценки укладываются в правила брифа: +8 п.п. против минимума +5 п.п., 3% против порога вреда более 5%. На 600 назначенных 0 известных пропусков по описанию сводки (0%).'
  derived_from: [CLM-002, CLM-003, CLM-004, CLM-008]
  confidence: {level: high, rationale: Воспроизводимая арифметика по агрегатам}
  limitations: Агрегаты не позволяют независимо проверить полноту на уровне операторов.
- id: CLM-010
  type: interpretation
  statement: Двусторонний 95% интервал Ньюкомба для разницы сортировки составляет от +1,16 до +14,75 п.п. Двусторонний 95% интервал Уилсона для обращений в тесте составляет от 1,59% до 5,60%. Интервалы пересекают пороги +5 п.п. выигрыша и 5% обращений соответственно.
  derived_from: [CLM-002, CLM-004, CLM-008, CLM-009]
  confidence: {level: high, rationale: Расчёт для двух независимо назначенных групп по проверенным счётчикам}
  limitations: Интервалы характеризуют статистическую неопределённость пилота в рамках описанного дизайна. Переносимость на другие склады неизвестна.
- id: CLM-011
  type: interpretation
  statement: Смета ниже потолка на 14 000 ₽. Без стоимости повторной маркировки на короб и смет или альтернативной ценности ресурса по вариантам нельзя сравнить чистый вклад или вывести окупаемость.
  derived_from: [CLM-005]
  confidence: {level: high, rationale: Разность известных сумм и явно обозначенный пробел в данных}
- id: CLM-012
  type: interpretation
  statement: При контрольной доле 72% математический потолок прироста правильной сортировки равен 100% − 72% = 28 п.п. Он требует устранения всех неуспешных исходов. Доля исходов, которую способна изменить подсказка или этикетка, неизвестна.
  derived_from: [CLM-008, CLM-009]
  confidence: {level: high, rationale: Верхняя граница доли при фиксированной базе пилота}
