- id: CLM-001
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: В учебном кейсе руководитель складского интерфейса выбирает работу на ближайшую неделю из четырёх вариантов. Печатную этикетку с операторами ещё не проверяли.
  evidence:
    - source: SRC-001
      locator: строка 3
- id: CLM-002
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Пилот на одном складе сравнивал текущий экран с подсказкой кода вручную подтверждённой зоны перед закрытием. Операторов случайно распределили по веткам. Единица назначения и анализа — оператор с первым подходящим закрытым коробом. Правила отбора коробов совпадали в обеих ветках.
  evidence:
    - source: SRC-001
      locator: строка 5
- id: CLM-003
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: За 24 часа фиксировали принятие короба в правильной зоне без повторной маркировки и факт хотя бы одного обращения к начальнику смены по той же операции. Сводка включает всех распределённых операторов, окно завершено у каждого, пропусков и дублей нет.
  evidence:
    - source: SRC-001
      locator: строка 7
    - source: SRC-002
      locator: строки 1–3, сводные счётчики по веткам
- id: CLM-004
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Минимальный выигрыш — +5 процентных пунктов принятия без повторной маркировки против контроля. Если к начальнику смены обращаются более 5% операторов тестовой ветки, расширение приостанавливают до отдельного решения.
  evidence:
    - source: SRC-001
      locator: строки 7 и 9
- id: CLM-005
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Смета на ближайшую учебную неделю — 36 000 ₽ при потолке 50 000 ₽. Стоимость повторной маркировки одного короба не измеряли.
  evidence:
    - source: SRC-001
      locator: строка 9
- id: CLM-006
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: Подготовка материалов и стендовая проверка допустимы до запуска на реальных сменах. Для запуска требуется отдельное согласование руководителя продукта и начальника склада. Обещания автоматического выбора зоны или отсутствия ошибок исключены.
  evidence:
    - source: SRC-001
      locator: строка 11
- id: CLM-007
  type: fact
  confidence: {level: high, rationale: Прямо зафиксировано в приложенных учебных материалах}
  statement: На учебном стенде подсказка показала перед закрытием код вручную подтверждённой зоны. Без подтверждённой зоны подсказка отсутствовала.
  evidence:
    - source: SRC-003
      locator: сценарии A и B, строки 5–6
  limitations: Протокол не измеряет скорость, число ошибок или переносимость на другие склады.
