- id: EXP-001
  tests: [HYP-001]
  decision: DEC-001
  expected_change: 'Гипотеза: выигрыш по приёмке в правильной зоне без повторной маркировки ≥+5 п.п. при доле обращений ≤5% в тесте.'
  metric: 'Правильная зона без повторной маркировки / все назначенные операторы в ветке. Хотя бы одно обращение по той же операции / все назначенные операторы в ветке. Оператор учитывается по первому подходящему закрытому коробу.'
  comparison: 'Случайное распределение операторов поровну на одном складе. Контроль — текущий экран. Тест — подсказка после ручного подтверждения, до закрытия. Правила отбора одинаковы.'
  duration: '24 часа по каждой операции. Финал после набора 1192 операторов в каждую ветку и закрытия всех окон. Реальный календарь после оценки потока и отдельного допуска.'
  effort: 'Подготовка и стенд на ближайшей учебной неделе. Общая смета 36 000 ₽ при потолке 50 000 ₽. Смета реальных смен не подтверждена.'
  side_effects: [обращения к начальнику смены, задержка закрытия короба, неверный показ кода или показ без подтверждения]
  stop_go: 'Stop имеет приоритет. Доля обращений >5% в тесте — приостановить расширение до отдельного решения. При полном результате stop по качеству, если верхняя граница 95% интервала выигрыша ниже +5 п.п. Go к отдельному рассмотрению, если данные полны, точечный выигрыш ≥+5 п.п., обращения ≤5%, нижняя граница 95% интервала выигрыша ≥+5 п.п. и верхняя граница 95% интервала обращений ≤5%. Пока условия неполны — нет решения go. Пересечение порогов интервалами при полных данных — на разбор без расширения. Интервальные и промежуточные правила предложены на C3.'
  owner: продуктовый аналитик совместно с начальником смены
- id: EXP-002
  tests: [HYP-002]
  decision: DEC-001
  expected_change: 'На стенде оператор различает сверку кода до закрытия и чтение маркировки после закрытия. Это помогает настроить запись места ошибки для будущей диагностики.'
  metric: 'Совпавшие коды до закрытия / сценарии с подтверждением. Показы без подтверждения / сценарии без подтверждения. Отдельно фиксируется этап расхождения кода.'
  comparison: 'Учебный стенд. С подтверждённой зоной и без подтверждения, плюс отдельный разбор учебного примера с расхождением на этапе чтения этикетки.'
  duration: 'Одна стендовая сессия на ближайшей учебной неделе, до любого допуска на реальные смены.'
  side_effects: [ошибочная локализация причины, задержка из-за дополнительной сверки]
  stop_go: 'Stop подготовки показа при несовпадении кода, позднем показе или показе без подтверждения. Go для передачи стендовых материалов при корректном поведении во всех обязательных сценариях. Ошибка чтения только после закрытия добавляется в схему кодирования. После отдельного допуска к наблюдениям сверить подтверждённый код, этикетку и считанный код. Подтверждённый случай ошибки чтения после закрытия возвращает этикетку в сравнение. Реальная частота причин неизвестна без наблюдений.'
  owner: руководитель складского интерфейса и оператор учебного стенда
