- id: DEC-001
  question: Какую работу готовить на ближайшую учебную неделю для сортировки складских возвратов?
  options: [ALT-001, ALT-002, ALT-003, ALT-004]
  criteria: [правильная сортировка без повторной маркировки, обращения к начальнику смены, бюджет недели]
  state: decided
  recommended: ALT-001
  based_on: [CLM-001, CLM-004, CLM-005, CLM-006, CLM-007, CLM-008, CLM-009, CLM-010, CLM-011, CLM-012, HYP-001, HYP-002]
  chosen: ALT-001
  decided_by: сценарный руководитель складского интерфейса
  decided_at: 2026-11-22
  rationale: |
    Основание выбора руководителя. «На C2 выбираю подготовку ограниченной проверки подсказки с кодом зоны на одном складе». Допуск к запуску на реальных сменах пока не согласован.
    Основание рекомендации агента. Пилотные оценки проходят точечные пороги CLM-004, но интервалы CLM-010 пересекают оба порога. CLM-007 подтверждает проверяемое поведение экрана. Рекомендуется подготовка, дальнейший допуск рассматривается отдельно.
  rejected:
    - {option: ALT-002, reason: Этикетку с операторами ещё не проверяли и причина ошибок не локализована}
    - {option: ALT-003, reason: Сравнительный пилот даёт основание готовить обратимую проверку}
    - {option: ALT-004, reason: Нет оценки большего вклада альтернативного использования ресурса}
  owner: руководитель складского интерфейса
  metrics:
    - Доля коробов в правильной зоне без повторной маркировки за 24 часа
    - Доля операторов с обращением к начальнику смены по той же операции за 24 часа
  review_triggers:
    - 'Доля обращений в тестовой ветке >5% — приостановить расширение до отдельного решения.'
    - 'Выигрыш <+5 п.п. на полной выборке — пересмотреть подготовленный подход.'
    - 'Недостижимый набор на одном складе или выход за потолок подготовки — пересогласовать объём до запуска.'
    - 'Подтверждённая ошибка чтения этикетки после закрытия — вернуть этикетку в сравнение.'
  review_by: 2026-11-29
