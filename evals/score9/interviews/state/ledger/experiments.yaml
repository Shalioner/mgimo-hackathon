- id: EXP-101
  tests: [HYP-101]
  expected_change: >-
    Дополнительный контроль к M27 EXP-001. В журнале выбора и выполнения видно,
    когда ответственный выбрал пакет, когда получил согласование и когда кабинет
    подтвердил подключение. Ранняя заявка при позднем подключении не засчитывается
    как своевременное выполнение.
  metric: >-
    Для каждой учебной линии отдельно отметить, произошло ли каждое из трёх
    событий до границы исчерпания. Основную метрику M27 EXP-001 считать отдельно.
  comparison: >-
    В двух учебных линиях один и тот же адресат с правами подключения, один свежий
    сигнал T+0, выбор и заявка в T+1, исчерпание пакета в T+5. В контрольной
    линии согласование в T+2 и подтверждение подключения в T+3. В отрицательной
    линии согласование в T+8 и подтверждение в T+9. T — начало сценария, смещения заданы в минутах.
    У обеих линий одинаковый интервал от согласования до подтверждения.
  duration: От получения сигнала до подтверждения подключения на условных часах.
  effort: Предложение для сухой репетиции на вымышленных событиях.
  side_effects:
  - Отправленную заявку ошибочно записывают как выполненное действие.
  - Время сообщения сотрудника ошибочно принимают за время исчерпания пакета.
  stop_go: >-
    Учебный контроль проходит, если в обеих линиях выбор отмечен как ранний,
    а своевременное выполнение отмечено только в линии с подтверждением T+3.
    Если ранняя заявка даёт зачёт выполнения при T+9 или прототип обещает
    выполнение до согласования, исправить учёт или текст и повторить контроль.
    Контроль вне набора и порогов согласованного M27 EXP-001.
