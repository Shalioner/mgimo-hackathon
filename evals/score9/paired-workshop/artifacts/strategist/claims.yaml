- id: CLM-001
  type: fact
  statement: Вводные пилота задают четыре учебные недели, единицу «один подписчик, одна бронь» и окно 7 календарных дней после бронирования для завершения практикума и хотя бы одного обращения в поддержку.
  evidence:
    - source: SRC-001
      locator: Строки 8–13, описание пилота и полей
      quote: |-
        мероприятие в течение 7 календарных дней после бронирования
  confidence:
    level: high
    rationale: Единица и окно явно заданы во вводных.
  limitations: Рандомизация и полнота исходов заявлены во вводных. Агрегаты по веткам сами по себе не подтверждают процедуры назначения и учёта.
- id: CLM-002
  type: fact
  statement: Во вводных задан полезный эффект +4 п.п. к доле завершивших против контроля. Вредом считается доля обращавшихся в поддержку выше 5% в тестовой ветке.
  evidence:
    - source: SRC-001
      locator: Строки 15–16, пороги пользы и вреда
      quote: |-
        Полезный эффект для решения — +4 п.п. к доле завершивших против контроля. Вред — обращения
        у более 5% подписчиков в тестовой ветке.
  confidence:
    level: high
    rationale: Оба порога явно заданы во вводных.
- id: CLM-003
  type: fact
  statement: Потолок бюджета на четыре недели составляет 80 000 руб., текущая смета — 62 000 руб. Экономика долгосрочного удержания не измерялась.
  evidence:
    - source: SRC-001
      locator: Строки 13 и 16–17, экономика и бюджет
      quote: |-
        80 000 руб. — потолок всего бюджета на четыре недели,
        текущая смета 62 000 руб.
  confidence:
    level: high
    rationale: Во вводных указаны потолок, смета и предел измерений.
  limitations: Смета не включает неизвестный долгосрочный доход.
- id: CLM-004
  type: fact
  statement: Вводные требуют, чтобы уведомление вело только в кабинет, не раскрывало расписание подписчика и позволяло отказаться от уведомлений. Следующая волна требует подтверждения технической возможности переноса, согласий и бюджета.
  evidence:
    - source: SRC-001
      locator: Строки 19–21, условия уведомления и запуска
  confidence:
    level: high
    rationale: Требования явно перечислены во вводных.
  limitations: Техническая возможность переноса, согласия и бюджет следующей волны требуют подтверждения.
- id: CLM-005
  type: fact
  statement: Вводные перечисляют текущее обслуживание, внутреннее напоминание с переносом, более дорогой звонок куратора и прекращение инициативы. Сопоставимый тест звонков отсутствует.
  evidence:
    - source: SRC-001
      locator: Строки 17–19, перечень вариантов и данные о звонках
  confidence:
    level: high
    rationale: Варианты и пробел в данных прямо указаны во вводных.
- id: CLM-006
  type: fact
  statement: За четыре учебные недели в контроле завершили практикум 264 из 400 подписчиков с бронью (66%), а в поддержку хотя бы раз обратились 12 из 400 (3%). Оба исхода измерены в течение 7 календарных дней после бронирования.
  evidence:
    - source: SRC-002
      locator: Строка 2, control. completed/reserved = 264/400, support_contacts/reserved = 12/400.
    - source: SRC-001
      locator: Строки 8–13, единица и окно исходов
      quote: |-
        мероприятие в течение 7 календарных дней после бронирования
  confidence: {level: high, rationale: Доли пересчитаны из исходных целых численностей.}
  limitations: Агрегаты описывают контроль пилота. Назначение и исходы на уровне подписчика не проверены.
- id: CLM-007
  type: fact
  statement: За четыре учебные недели в ветке напоминания завершили практикум 300 из 400 подписчиков с бронью (75%), а в поддержку хотя бы раз обратились 16 из 400 (4%). Оба исхода измерены в течение 7 календарных дней после бронирования.
  evidence:
    - source: SRC-002
      locator: Строка 3, reminder. completed/reserved = 300/400, support_contacts/reserved = 16/400.
    - source: SRC-001
      locator: Строки 8–13, единица и окно исходов
      quote: |-
        мероприятие в течение 7 календарных дней после бронирования
  confidence: {level: high, rationale: Доли пересчитаны из исходных целых численностей.}
  limitations: Агрегаты описывают ветку напоминания пилота. Назначение и исходы на уровне подписчика не проверены.
- id: CLM-008
  type: interpretation
  statement: В пилоте напоминание относительно контроля дало наблюдаемую разницу +9 п.п. по завершению и +1 п.п. по обращениям. Точечный прирост завершения выше порога +4 п.п., доля обращавшихся 4% ниже порога вреда выше 5%.
  derived_from: [CLM-002, CLM-006, CLM-007]
  confidence: {level: medium, rationale: "Арифметика воспроизводима, причинный эффект и устойчивое соблюдение порогов пока не установлены."}
- id: CLM-009
  type: interpretation
  statement: При независимых наблюдениях ориентировочный 95% интервал Wald для разности завершения составляет от +2,71 до +15,29 п.п., а 95% интервал Wilson для доли обращавшихся в ветке напоминания составляет от 2,48% до 6,40%. Оба интервала пересекают соответствующие пороги решения.
  derived_from: [CLM-002, CLM-006, CLM-007]
  confidence: {level: medium, rationale: "Интервалы воспроизводимы по агрегатам, но их допущения о независимости и отсутствии систематической ошибки не проверены."}
- id: CLM-010
  type: interpretation
  statement: Запас между потолком бюджета 80 000 руб. и сметой 62 000 руб. равен 18 000 руб. на четырёхнедельном горизонте.
  derived_from: [CLM-003]
  confidence: {level: high, rationale: Разность заявленного потолка и сметы.}
  limitations: Арифметический запас не подтверждает доступность бюджета или полноту сметы.
- id: CLM-011
  type: interpretation
  statement: При контрольной доле завершения 66% абсолютный арифметический потолок прироста составляет +34 п.п., если в той же когорте завершение достигнет 100%.
  derived_from: [CLM-006]
  confidence: {level: high, rationale: 100% минус 66%.}
  limitations: Доля предотвратимых пропусков неизвестна, поэтому предел не оценивает достижимый эффект отдельного вмешательства.
- id: CLM-012
  type: interpretation
  statement: Базовый результат по завершению и обращениям даёт наблюдаемый ориентир для сохранения текущего обслуживания. Ограниченная проверка напоминания способна уточнить пользу и вред, если проверка данных и запуск выполнимы.
  derived_from: [CLM-004, CLM-006, CLM-008, CLM-009]
  confidence: {level: medium, rationale: "Доступен сигнал по напоминанию, но сохраняются неопределённость эффекта и условия допуска."}
