    - Завершившие практикум / все распределённые брони по ветке в течение семи календарных дней после бронирования.
    - Подписчики хотя бы с одним обращением / все распределённые брони по ветке в том же окне.
    - Полная смета четырёхнедельной волны.
  review_triggers:
    - Данные назначения или исходов непригодны для причинного сравнения.
