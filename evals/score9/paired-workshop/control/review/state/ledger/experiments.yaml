- id: EXP-001
  tests: [HYP-002]
  decision: DEC-001
  expected_change: Подтверждены сценарии показа и переноса, целостность брони, конфиденциальность, отказ от уведомлений, согласия, смета и поток набора.
  metric: Обязательные сценарии с ожидаемым исходом / все обязательные сценарии. Отдельно фиксируются блокирующие расхождения в бюджете, согласиях, учёте или прогнозе набора.
  comparison: Сверка фактического поведения в тестовой среде с матрицей ожидаемых исходов и сверка плана с документами.
  duration: До отдельного решения о запуске волны. Календарная дата зависит от предоставления тестовой среды и материалов.
  effort: Тестовые брони и локальная сверка документов. Контакты с подписчиками, расходы и запуск требуют отдельного разрешения.
  side_effects: [Двойная бронь, Потеря исходного слота, Раскрытие расписания, Показ после отказа, Недостаточный набор или неполная смета]
  stop_go: "Stop при критическом сбое, отсутствии подтверждения согласий, полного бюджета, пригодности данных или достижимого набора. Go к запросу отдельного разрешения на полевую волну при подтверждении всех обязательных сценариев и условий."
  status_note: CHG-001 подтвердил часть сценариев по CLM-013 и CLM-014. CHG-002 оставляет EXP-001 незавершённым. Продолжение подготовки к допуску зависит от повторного C2.
  owner: Руководитель продукта совместно с техническим ответственным
- id: EXP-002
  tests: [HYP-001]
  decision: DEC-001
  expected_change: Прирост завершения относительно контроля достигает порога пользы при допустимой доле обращений в тестовой ветке.
  metric: Завершившие в течение 7 календарных дней / все распределённые брони каждой ветки. Подписчики хотя бы с одним обращением за то же окно / все распределённые брони той же ветки.
  comparison: Параллельный рандомизированный контроль с текущим обслуживанием. Единица назначения и анализа — подписчик с одной бронью, анализ по назначению.
  duration: До 4 недель на набор и наблюдение, обязательные 7 календарных дней по каждой броне. Набор до 21 дня.
  effort: Минимум 2134 брони на группу при базе 66% и MDE +4 п.п. Требуются подтверждённые поток и полная смета в пределах 80 000 руб.
  side_effects: [Рост нагрузки на поддержку, Ошибка переноса или двойная бронь, Раскрытие расписания, Показ после отказа, Исчерпание доступных слотов]
  stop_go: "Stop при критическом сбое или необратимом превышении лимита обращений при заранее фиксированном максимальном знаменателе. На финале stop при доле обращавшихся в тесте >5% или верхней границе интервала прироста <+4 п.п. Go к рассмотрению следующего решения при полных данных, нижней границе интервала прироста ≥+4 п.п., верхней границе интервала обращений ≤5% и соблюдении бюджета и ограничений. Прочие полные результаты — неопределённость. При неполных данных без сработавшего stop решения go нет."
  status_note: CHG-002. Будущая проверка на паузе до повторного C2. Пороги и протокол сохранены. Исправленный пилот предшествует EXP-002.
  owner: Продуктовый аналитик и руководитель продукта
