  decided_by: Сценарный руководитель
  decided_at: '2026-11-22'
  owner: Руководитель продукта
  review_by: '2026-11-30'
  rationale: >-
    Сценарный руководитель выбрал ограниченную проверку внутреннего напоминания со ссылкой на перенос.
    Прежние основания сохранены в снимке до CHG-002. По исправленной выгрузке эффект ниже порога пользы, а доля обращавшихся выше порога вреда [CLM-017]. Рекомендация агента — ALT-002, обычное обслуживание и пауза волны до нового решения руководителя.
  metrics:
    - Завершившие практикум / все распределённые брони по ветке в течение семи календарных дней после бронирования.
    - Подписчики хотя бы с одним обращением / все распределённые брони по ветке в том же окне.
    - Полная смета четырёхнедельной волны.
  review_triggers:
    - Данные назначения или исходов непригодны для причинного сравнения.
    - Перенос, согласия или полная смета не подтверждены, либо запланированный набор не помещается в горизонт.
    - Результат пересекает порог вреда, не достигает порога пользы или остаётся неопределённым.
  status_note: CHG-002. C2 повторно открыт. ALT-001 — последнее решение человека, поставленное на пересмотр. Прежняя квитанция C3 относится к историческому пакету. Полевая волна на паузе.
