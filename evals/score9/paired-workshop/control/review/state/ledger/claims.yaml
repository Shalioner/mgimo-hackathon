- id: CLM-010
  type: interpretation
  statement: Запас между потолком бюджета 80 000 руб. и сметой 62 000 руб. равен 18 000 руб. на четырёхнедельном горизонте.
  derived_from: [CLM-003]
  confidence: {level: high, rationale: Разность заявленного потолка и сметы.}
  limitations: Арифметический запас не подтверждает доступность бюджета или полноту сметы.
- id: CLM-011
  type: interpretation
  statement: При контрольной доле завершения 66% абсолютный арифметический потолок прироста составляет +34 п.п., если в той же когорте завершение достигнет 100%.
  derived_from: [CLM-006]
  confidence: {level: high, rationale: 100% минус 66%.}
  limitations: Доля предотвратимых пропусков неизвестна, поэтому предел не оценивает достижимый эффект отдельного вмешательства.
- id: CLM-012
  type: interpretation
  statement: Базовый результат по завершению и обращениям даёт наблюдаемый ориентир
    для сохранения текущего обслуживания. Ограниченная проверка напоминания способна
    уточнить пользу и вред, если проверка данных и запуск выполнимы.
  derived_from:
  - CLM-004
  - CLM-006
  - CLM-008
  - CLM-009
  confidence:
    level: medium
    rationale: Доступен сигнал по напоминанию, но сохраняются неопределённость эффекта
      и условия допуска.
  status: superseded
  superseded_by: CLM-019
  updated: '2026-11-22'
  status_note: Заменено по CHG-002. Прежняя формулировка остается в истории.
- id: CLM-013
  type: fact
  statement: В авторизованном тестовом кабинете пользователь перенёс собственную активную бронь на свободный слот. Кабинет подтвердил перенос, в списке остался один активный слот.
  evidence:
    - source: SRC-003
      locator: Строки 3–4, своя бронь и результат выбора свободного слота
      quote: В авторизованном личном кабинете U-01 видит собственную бронь и кнопку «Перенести».
    - source: SRC-003
      locator: Строка 4, подтверждение переноса и состояние списка
      quote: После выбора свободного слота показано «Запись перенесена». Во вкладке «Мои записи» остался один активный слот.
  confidence: {level: medium, rationale: Протокол прямо описывает наблюдаемый результат одного учебного прогона.}
  limitations: Подтверждение относится к указанной тестовой записи и свободному слоту. Допуск реальных пользователей, полная смета, доступность во всех случаях и полевой эффект остаются открытыми.
- id: CLM-014
  type: fact
  statement: В отдельных учебных прогонах исходная бронь сохранилась при попытке выбрать занятый слот, другой пользователь не получил доступ к чужой брони, а контрольная отправка после отказа не состоялась.
  evidence:
    - source: SRC-003
      locator: Строка 4, попытка переноса в занятый слот
      quote: При попытке переноса в занятый слот для записи R-111 исходная бронь сохранилась.
    - source: SRC-003
      locator: Строка 5, чужая бронь и контрольная отправка
      quote: Пользователь U-02 не получил доступ к брони U-01. После отключения напоминаний контрольная отправка для U-01 не состоялась.
  confidence: {level: medium, rationale: Протокол содержит наблюдения по указанным проверкам.}
  limitations: Эти наблюдения ограничены описанными прогонами. Полный набор проверок уведомления, конфиденциальности, согласий и обработки ошибок остаётся открытым.
- id: CLM-015
  type: fact
  statement: Владелец выгрузки сообщил, что объединение с таблицей командных аккаунтов
    учло завершения чужих заказов и пропустило часть обращений в ветке напоминания.
    Исправление относится к тем же подписчикам и окну. Контроль, смета, пороги и ограничения
    согласия сохранены.
  evidence:
  - source: SRC-004
    locator: Строки 3–8, причина и область исправления
    quote: несвоих заказов и пропустил часть обращений именно в ветке reminder
  confidence:
    level: high
    rationale: Владелец прямо указал причину и область замены.
  limitations: Механизм ошибки описан владельцем. Исходный join и данные отдельных
    подписчиков не предоставлены.
- id: CLM-016
  type: fact
  statement: В исправленной ветке напоминания за четыре учебные недели завершили практикум
    276 из 400 подписчиков с бронью (69%), а в поддержку хотя бы раз обратились 24
    из 400 (6%). Для обоих исходов использовано окно 7 календарных дней после бронирования.
  evidence:
  - source: SRC-005
    locator: Строка 3, reminder. completed/reserved = 276/400, support_contacts/reserved = 24/400.
  - source: SRC-001
    locator: Строки 8–13, окно исходов
    quote: мероприятие в течение 7 календарных дней после бронирования
  confidence:
    level: high
    rationale: Доли пересчитаны из числителей и знаменателя исправленной выгрузки.
  limitations: Агрегаты не подтверждают корректность процедур назначения и учёт каждой
    брони.
- id: CLM-017
  type: interpretation
  statement: По исправленному пилоту прирост завершений к контролю +3 п.п. при пороге
    +4 п.п. Доля обращавшихся в тестовой ветке 6% при пороге вреда выше 5%. Разница
    долей обращавшихся относительно контроля +3 п.п. Правило финального stop срабатывает
    по точечной доле обращавшихся в тесте.
  derived_from:
  - CLM-002
  - CLM-006
  - CLM-016
  confidence:
    level: high
    rationale: Пороговый вывод непосредственно следует из агрегатов за то же окно.
  limitations: Описательная разность не доказывает причинный эффект напоминания.
- id: CLM-018
  type: interpretation
  statement: Ориентировочный двусторонний 95% интервал Wald для разности завершений
    от −3,49 до +9,49 п.п. Двусторонний 95% интервал Wilson для доли обращавшихся
    в ветке напоминания от 4,06% до 8,77%. Интервалы пересекают оба порога. Верхняя
    граница пользы выше +4 п.п., а stop следует из наблюдаемых 6% обращавшихся.
  derived_from:
  - CLM-002
  - CLM-006
  - CLM-016
  - CLM-017
  confidence:
    level: medium
    rationale: Интервалы воспроизводимы при биномиальной модели и независимых наблюдениях.
  limitations: Оценка не учитывает возможные ошибки назначения и систематические ошибки
    учёта.
- id: CLM-019
  type: interpretation
  statement: Обычное обслуживание служит обратимой базой на время разбора. Перезапуск
    того же напоминания требует проверки учёта и отдельного основания ожидать достижения
    полезного эффекта при допустимой нагрузке.
  derived_from:
  - CLM-004
  - CLM-006
  - CLM-015
  - CLM-017
  - CLM-018
  confidence:
    level: medium
    rationale: Исправленные точечные оценки нарушают оба критерия, а приемлемый результат
      переработанного сценария остаётся неизвестным.
