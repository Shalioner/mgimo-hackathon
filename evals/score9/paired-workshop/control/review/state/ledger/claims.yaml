- id: CLM-001
  type: fact
  statement: Вводные пилота задают четыре учебные недели, единицу «один подписчик, одна бронь» и окно 7 календарных дней после бронирования для завершения практикума и хотя бы одного обращения в поддержку.
  evidence:
    - source: SRC-001
      locator: Строки 8–13, описание пилота и полей
      quote: |-
        мероприятие в течение 7 календарных дней после бронирования
  confidence:
    level: high
    rationale: Единица и окно явно заданы во вводных.
  limitations: Рандомизация и полнота исходов заявлены во вводных. Агрегаты по веткам сами по себе не подтверждают процедуры назначения и учёта.
- id: CLM-002
  type: fact
  statement: Во вводных задан полезный эффект +4 п.п. к доле завершивших против контроля. Вредом считается доля обращавшихся в поддержку выше 5% в тестовой ветке.
  evidence:
    - source: SRC-001
      locator: Строки 15–16, пороги пользы и вреда
      quote: |-
        Полезный эффект для решения — +4 п.п. к доле завершивших против контроля. Вред — обращения
        у более 5% подписчиков в тестовой ветке.
  confidence:
    level: high
    rationale: Оба порога явно заданы во вводных.
- id: CLM-003
  type: fact
  statement: Потолок бюджета на четыре недели составляет 80 000 руб., текущая смета — 62 000 руб. Экономика долгосрочного удержания не измерялась.
  evidence:
    - source: SRC-001
      locator: Строки 13 и 16–17, экономика и бюджет
      quote: |-
        80 000 руб. — потолок всего бюджета на четыре недели,
        текущая смета 62 000 руб.
  confidence:
    level: high
    rationale: Во вводных указаны потолок, смета и предел измерений.
  limitations: Смета не включает неизвестный долгосрочный доход.
- id: CLM-004
  type: fact
  statement: Вводные требуют, чтобы уведомление вело только в кабинет, не раскрывало расписание подписчика и позволяло отказаться от уведомлений. Следующая волна требует подтверждения технической возможности переноса, согласий и бюджета.
  evidence:
    - source: SRC-001
      locator: Строки 19–21, условия уведомления и запуска
  confidence:
    level: high
    rationale: Требования явно перечислены во вводных.
  limitations: Техническая возможность переноса, согласия и бюджет следующей волны требуют подтверждения.
- id: CLM-005
  type: fact
  statement: Вводные перечисляют текущее обслуживание, внутреннее напоминание с переносом, более дорогой звонок куратора и прекращение инициативы. Сопоставимый тест звонков отсутствует.
  evidence:
    - source: SRC-001
      locator: Строки 17–19, перечень вариантов и данные о звонках
  confidence:
    level: high
    rationale: Варианты и пробел в данных прямо указаны во вводных.
- id: CLM-006
  type: fact
  statement: За четыре учебные недели в контроле завершили практикум 264 из 400 подписчиков
    с бронью (66%), а в поддержку хотя бы раз обратились 12 из 400 (3%). Оба исхода
    измерены в течение 7 календарных дней после бронирования.
  evidence:
  - source: SRC-005
    locator: Строка 2, control. completed/reserved = 264/400, support_contacts/reserved
      = 12/400.
  - source: SRC-001
    locator: Строки 8–13, единица и окно исходов
    quote: мероприятие в течение 7 календарных дней после бронирования
  confidence:
    level: high
    rationale: Доли пересчитаны из исходных целых численностей.
  limitations: Агрегаты описывают контроль пилота. Назначение и исходы на уровне подписчика
    не проверены.
