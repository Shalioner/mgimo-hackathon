- id: CLM-009
  contradicted_by:
  - CLM-018
  type: interpretation
  statement: При независимых наблюдениях ориентировочный 95% интервал Wald для разности
    завершения составляет от +2,71 до +15,29 п.п., а 95% интервал Wilson для доли
    обращавшихся в ветке напоминания составляет от 2,48% до 6,40%. Оба интервала пересекают
    соответствующие пороги решения.
  derived_from:
  - CLM-002
  - CLM-006
  - CLM-007
  confidence:
    level: medium
    rationale: Интервалы воспроизводимы по агрегатам, но их допущения о независимости
      и отсутствии систематической ошибки не проверены.
  status: superseded
  superseded_by: CLM-018
