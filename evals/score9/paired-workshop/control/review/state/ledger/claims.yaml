- id: CLM-008
  contradicted_by:
  - CLM-017
  type: interpretation
  statement: В пилоте напоминание относительно контроля дало наблюдаемую разницу +9
    п.п. по завершению и +1 п.п. по обращениям. Точечный прирост завершения выше порога
    +4 п.п., доля обращавшихся 4% ниже порога вреда выше 5%.
