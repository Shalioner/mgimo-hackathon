- id: ALT-001
  title: Продолжить ограниченную проверку напоминания с переносом
  kind: invest
  description: Подготовить повторную проверку нового действия в кабинете. Запуск волны требует проверки данных, переноса, согласий и бюджета.
  supported_by: [CLM-002, CLM-004, CLM-010, CLM-013, HYP-002]
  objections:
    - text: "Повтор той же версии рискует воспроизвести нагрузку на поддержку. Исправленный пилот уже даёт превышение порога вреда и прирост ниже порога пользы. [CLM-017, CLM-018]"
      refs: [CLM-017, CLM-018, HYP-001]
  costs_revenue: Текущая смета 62 000 руб. при потолке 80 000 руб. на четыре недели. Нужна полная подтверждённая смета. Доход от удержания неизвестен.
- id: ALT-002
  title: Оставить текущее обслуживание
  kind: status_quo
  description: Сохранить обычный процесс и учёт исходов, оставив инициативу доступной для пересмотра.
  supported_by: [CLM-006, CLM-017, CLM-019]
  objections:
    - text: "При реальном эффекте у верхней границы интервала [CLM-018] отсрочка оставит часть предотвратимых незавершений."
      refs: [CLM-018]
  costs_revenue: Дополнительная волна не оплачивается. Базовые операционные затраты и цена упущенных завершений неизвестны.
- id: ALT-003
  title: Переключиться на проверку звонка куратора
  kind: change
  description: Проверить персональный телефонный контакт вместо внутреннего уведомления при наличии отдельного основания, согласий и сметы.
  supported_by: [CLM-002, CLM-003, CLM-005]
  objections:
    - text: "Если преимущество звонка останется неизмеренным, более дорогой канал из [CLM-005] займёт бюджет без основания ожидать больше завершений."
      refs: [CLM-005]
  costs_revenue: Канал дороже по вводным. Сопоставимая стоимость, эффект и нагрузка неизвестны.
- id: ALT-004
  title: Прекратить инициативу
  kind: kill
  description: Убрать инициативу из плана и снять выделение ресурса на её проверку. Обычное обслуживание подписчиков продолжается.
  supported_by: [CLM-003, CLM-017, CLM-019]
  objections:
    - text: "Верхняя граница эффекта допускает полезный результат [CLM-018]. Закрытие увеличит цену возврата при появлении более убедительного основания."
      refs: [CLM-018]
  costs_revenue: Возможен выигрыш от высвобождения ресурса. Его ценность и переходные затраты не измерены.
