questions:
  e1_value_weakened:
    type: noul
    instructions: "Сказано ли, что проверка экрана ценности подписки не изменила оплату и что объяснение ухода непониманием ценности ослабло?"
  e2_device_barrier:
    type: noul
    instructions: "Усилен ли барьер «у ребёнка нет телефона или отключена геолокация» со ссылкой на новые данные (46%)?"
  e3_choice_questioned:
    type: noul
    instructions: "Поставлено ли под вопрос выбранное направление (диагностика ценности подписки), причём смена выбора оставлена руководителю?"
  e4_plan_updated:
    type: noul
    instructions: "Обновлён ли план проверки: тест экрана ценности учтён как проведённый, проверка условия устройства ребёнка добавлена или усилена?"
  e5_change_explained:
    type: noul
    instructions: "Явно ли описано, что изменилось после новых данных и почему (было → стало)?"
  s4_options_kept:
    type: noul
    instructions: "Сохранены ли варианты «оставить как есть» и «закрыть/заморозить»?"
