# Рубрика сравнения (зафиксирована до прогона). Вопросы не зависят от формата документа.
questions:
  r01_sources:
    type: noul
    instructions: "У ключевых чисел и фактов указано, из какого материала или источника они взяты?"
  r02_types:
    type: noul
    instructions: "Явно отделены факты от гипотез, допущений и прогнозов (видно по меткам или формулировкам)?"
  r03_gaps:
    type: noul
    instructions: "Названы пробелы: чего не знаем, почему и как это узнать?"
  r04_options:
    type: noul
    instructions: "Есть не меньше трёх содержательно разных вариантов, включая «оставить как есть» и «закрыть/свернуть»?"
  r05_objections:
    type: noul
    instructions: "У каждого варианта есть сильное содержательное возражение?"
  r06_product:
    type: noul
    instructions: "Продуктовая стратегия содержит аудиторию и её задачу, альтернативы, выбранное направление, осознанные отказы и связь пользы с затратами?"
  r07_comms:
    type: noul
    instructions: "Коммуникационная стратегия содержит барьер, ключевое сообщение с подтверждением и роль каналов, и обещания привязаны к функциям продукта?"
  r08_validation:
    type: noul
    instructions: "План проверки содержит ожидаемое изменение, с чем сравниваем, срок, нежелательные последствия и критерии stop/go?"
  r09_human:
    type: noul
    instructions: "Решение оставлено человеку, а рекомендация дана с уровнем уверенности?"
  r10_triggers:
    type: noul
    instructions: "Сказано, какие новые данные изменили бы рекомендацию (условия пересмотра)?"
