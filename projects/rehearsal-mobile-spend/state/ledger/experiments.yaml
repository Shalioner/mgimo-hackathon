- id: EXP-001
  tests: [HYP-001]
  decision: DEC-001
  expected_change: В тестовых ситуациях предупреждение приходит уполномоченной роли и объясняет действие до возможного последствия.
  metric: Число доступных сценариев, где действие выбрано раньше последствия / число сценариев с доступным действием. Отдельно ошибки роли и дубли.
  comparison: Один и тот же тестовый ряд событий с прототипом предупреждения и без него.
  duration: До 10 рабочих дней для подготовки и разбора сценариев.
  effort: Сухая репетиция на вымышленных событиях. Участники и внешний бюджет не утверждены.
  side_effects: [Сигнал не тому получателю, Повторный или запоздалый сигнал, Принятие риска исчерпания за денежное списание]
  stop_go: 'Остановить при неверном получателе или ложном обещании действия. Перейти к сравнению, если в 4 из 6 доступных сценариев действие выбрано своевременно и все 3 отрицательных контроля корректны. Иначе исправить прототип или разбирать отчёт.'
  owner: Руководитель продукта и тестировщик
- id: EXP-002
  tests: [HYP-002]
  decision: DEC-001
  expected_change: Сравнение показывает, даёт ли предупреждение добавочное время для действия относительно проверки отчёта.
  metric: Число своевременных правильных действий / те же 6 сценариев в каждом режиме. Дополнительно время поиска и корректный пересказ смысла сигнала.
  comparison: Сопоставить макет предупреждения и макет периодического отчёта на одинаковых ситуациях с чередованием порядка.
  duration: То же окно, после проверки отрицательных контролей EXP-001.
  effort: Сравнение сценариев и двух макетов. Результат не является причинной оценкой поведения клиентов.
  side_effects: [Эффект порядка и подсказки, Систематически позднее обновление данных, Ошибка в трактовке денежных и трафиковых порогов]
  stop_go: 'Если предупреждение даёт хотя бы 2 дополнительных своевременных действия без новых критических ошибок, оставить направление для следующей проверки. При равном результате предпочтителен отчёт. При недостатке сценариев вывод отложить.'
  owner: Исследовательская роль
- id: EXP-003
  tests: [HYP-003]
  decision: DEC-001
  expected_change: Установлены диапазоны предотвратимых событий, операционной стоимости и пользы, чтобы оценить оправданность технического пилота.
  metric: Предотвратимые события / пригодные события тестового периода; раздельные издержки клиента, команды и влияние на выручку.
  comparison: Чистый дополнительный эффект предупреждений относительно текущего процесса и отчёта, без двойного учёта потерь.
  duration: До первого разбора. Если появятся разрешённые агрегаты, период должен покрывать полный расчётный цикл.
  effort: Сценарная сверка и спецификация данных. Подключение к реальным системам отдельно согласуется.
  side_effects: [Перенос учебных чисел на рынок, Игнорирование времени реакции, Смешение пользы клиента с выручкой оператора]
  stop_go: 'Если пригодных фактических входов нет, денежный эффект неизвестен. При чистом эффекте не выше нуля или при отсутствии подтверждённой операционной осуществимости внешний пилот отложить. Учебная граница 0.50 действует только при базовых допущениях.'
  owner: Руководитель продукта и продуктовый аналитик
