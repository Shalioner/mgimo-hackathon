- id: ALT-001
  title: Прототип предупреждений ответственному за связь
  kind: invest
  description: Проверить событийное предупреждение о риске исчерпания с указанием доступного действия.
  supported_by: [CLM-001, CLM-004, HYP-001]
  objections:
  - text: При запаздывающих событиях или отсутствии полномочий сигнал создаст работу без предотвращения потерь.
    refs: [HYP-001, HYP-003]
  costs_revenue: Нужны данные, доставка, настройка роли и обработка сигналов. Польза зависит от доли своевременных действий.
- id: ALT-002
  title: Прототип отчёта о потреблении
  kind: change
  description: Сравнить отчёт по номерам с текущим процессом на задачах контроля пакетов и расходов.
  supported_by: [CLM-002, CLM-003, CLM-005, HYP-002]
  objections:
  - text: Отчёт может повторить детализацию и оказаться бесполезным для короткого окна между риском и последствием.
    refs: [CLM-002, HYP-001]
  costs_revenue: Ручная проверка макета обратима. Польза возникает лишь при уменьшении времени сверки или предотвращении значимого события.
- id: ALT-003
  title: Сохранить текущий подход
  kind: status_quo
  description: Использовать доступные личные кабинеты, детализацию и настроенные лимиты. Зафиксировать пробелы без нового интерфейса.
  supported_by: [CLM-001, CLM-002, CLM-003]
  objections:
  - text: Если кабинеты разрознены или действия требуется выполнить быстро, существующий подход сохранит потери.
    refs: [HYP-001, HYP-003]
  costs_revenue: Нет новой разработки, но ручная работа и предотвратимые потери могут сохраниться.
- id: ALT-004
  title: Заморозить работу над отдельной функцией
  kind: kill
  description: Убрать направление из плана до появления пригодных данных о предотвратимых событиях и экономике.
  supported_by: [CLM-005, HYP-003]
  objections:
  - text: Без дешёвой проверки можно пропустить значимый и предотвратимый риск для рабочих номеров.
    refs: [CLM-004, HYP-003]
  costs_revenue: Экономит ресурс разработки и исследования. Цена упущенной пользы неизвестна.
