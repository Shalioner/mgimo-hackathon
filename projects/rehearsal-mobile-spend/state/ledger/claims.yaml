- id: CLM-001
  type: fact
  statement: При включённом автоинформировании МТС описывает уведомления сотруднику на 20%, 50%, 80% и 100% корпоративного денежного лимита связи.
  evidence:
  - source: SRC-001
    quote: включена бесплатная услуга «Автоинформирование о балансе»
  - source: SRC-001
    quote: ему поступят уведомления, что он израсходовал 20%, 50%, 80% и 100% от установленного корпоративного лимита на связь.
  confidence: {level: high, rationale: Пороги и адресат указаны в документации оператора.}
  limitations: Лимит расходов на связь. Доставка администратору, задержка и отдельный порог объёма трафика не проверены.
- id: CLM-002
  type: fact
  statement: билайн бизнес описывает настройку индивидуальных лимитов и детализацию расходов по каждому корпоративному номеру.
  evidence:
  - source: SRC-002
    quote: устанавливать лимиты расходов и блокировать платные подписки для каждого сотрудника индивидуально.
  - source: SRC-002
    quote: детализация звонков и расходов доступна по каждому номеру.
  confidence: {level: high, rationale: Возможности указаны в официальном FAQ.}
  limitations: Охват по договорам, актуальность данных и частота использования не измерены.
- id: CLM-003
  type: fact
  statement: В описании «Гибкого интернета» билайн для устройств передачи данных указана ручная проверка остатка в личном кабинете.
  evidence:
  - source: SRC-003
    quote: "Проверить остаток интернет-трафика можно несколькими способами: в личном кабинете"
  - source: SRC-003
    quote: Тарифные планы предназначены для использования только в Data-устройствах
  confidence: {level: high, rationale: Назначение тарифа и способ контроля названы в FAQ.}
  limitations: Описаны data-устройства. Перенос на смартфоны сотрудников не установлен.
- id: CLM-004
  type: fact
  statement: В условиях тарифа МегаФона «Управляй! Директор» исчерпание доступных пакетов интернета приводит к ограничению скорости 64 кб/с.
  evidence:
  - source: SRC-004
    quote: После исчерпания пакета интернет трафика
  - source: SRC-004
    quote: ограничение скорости 64 кб/с
    locator: Таблица «Стоимость мобильного интернета»
  confidence: {level: high, rationale: Последствие указано в открытом тарифном документе.}
  limitations: Пример одного тарифа. Доступность, правила других тарифов и частота исчерпания не проверены.
- id: CLM-005
  type: interpretation
  statement: Граница пакета трафика, денежный лимит и доступность связи представляют разные события. Их следует измерять отдельно при сравнении вариантов.
  derived_from: [CLM-001, CLM-002, CLM-003, CLM-004]
  confidence: {level: high, rationale: Описания операторов используют разные единицы и последствия.}
  limitations: Вывод относится к дизайну проверки. Частота, цена и устранимость событий для целевого сегмента неизвестны.
- id: CLM-006
  type: forecast
  statement: 'Учебная модель предупреждений даёт базовый чистый эффект -450 ₽/мес на условном портфеле, сценарный диапазон от -6700 до 22700 ₽/мес. При прочих базовых входах безубыточность требует долю своевременных действий 0.50.'
  derived_from: [HYP-004]
  confidence: {level: low, rationale: 'Воспроизводимый расчёт tools/econ.py по state/economics.yaml; значения входов не измерены.'}
  limitations: Суммарный условный эффект клиента и оператора. Это не изменение выручки, расчёт цены или прогноз рынка.
- id: CLM-007
  type: fact
  statement: Текстовый макет F1 показывает рабочий номер, риск исчерпания пакета интернета и подсказку открыть карточку номера для проверки остатка.
  evidence:
  - source: SRC-005
    quote: '| Рабочий номер | Линия А |'
  - source: SRC-005
    quote: '| Тип риска | Скоро исчерпается пакет мобильного интернета |'
  - source: SRC-005
    quote: '| Доступное действие | Откройте карточку номера, чтобы проверить остаток |'
  confidence: {level: high, rationale: Все поля непосредственно показаны в текстовом макете.}
  limitations: Вымышленный пример. Макет подтверждает только содержание сообщения. Подключение, доставку и эффект ещё предстоит проверить.
- id: CLM-008
  type: fact
  statement: В учебном терминальном проходе M27 EXP-001 с одним участником зарегистрировано 5 своевременных правильных выборов.
  evidence:
  - source: SRC-006
    quote: '"timely_correct": 5'
  confidence: {level: medium, rationale: Результат пересчитан из отдельных ответов и дедлайнов сохранённой квитанции.}
  limitations: Сценарии вымышлены. Это наблюдение одного участника в терминальном макете. Сравнение с отчётом и поведение клиентов остаются непроверенными.
- id: CLM-009
  type: fact
  statement: В учебном проходе EXP-002 с одним участником зарегистрировано 5 своевременных правильных выборов с предупреждением и 4 с отчётом на тех же событиях.
  evidence:
  - source: SRC-007
    quote: '"timely_correct": 5'
  - source: SRC-007
    quote: '"timely_correct": 4'
  - source: SRC-007
    quote: '"outcome": "below_margin"'
  confidence: {level: medium, rationale: Ответы и дедлайны пересчитаны по квитанции.}
  limitations: Шесть вымышленных событий и один участник, знакомый с предупреждением по EXP-001. Измерялась работа с уже показанным экраном. Доставка уведомлений и поведение клиентов не измерялись.
