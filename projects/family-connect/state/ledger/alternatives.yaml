- id: ALT-001
  title: Семейный сигнал и переход к выделению
  kind: invest
  description: Подготовить ограниченный пилот на совместимом тарифе.
  supported_by:
  - CLM-002
  - HYP-001
  - HYP-003
  objections:
  - text: Если запас времени мал, сигнал только создаст новые обращения.
    refs:
    - HYP-001
  costs_revenue: Новые затраты на события, доставку и статус, вклад от оплаченных
    месяцев неизвестен.
- id: ALT-002
  title: Предупреждение по своему номеру
  kind: change
  description: Проверить случаи простоя телефона или роутера через действующий кабинет.
  supported_by:
  - CLM-005
  - CLM-006
  - HYP-002
  objections:
  - text: Если преобладает выключение устройств, уведомление о балансе не может предотвратить
      простой.
    refs:
    - HYP-002
  costs_revenue: Нужны данные и сообщения для выбранного номера, вклад зависит от
    доли предотвратимых событий.
- id: ALT-003
  title: Диагностика причин перед пилотом
  kind: change
  description: Сначала измерить причины, запас времени, согласия и поток на одном
    тарифе, затем решить о пилоте.
  supported_by:
  - CLM-003
  - CLM-012
  - HYP-003
  objections:
  - text: Если своевременный механизм и поток уже подтверждены, дополнительный этап
      отодвинет пользу.
    refs:
    - HYP-003
  costs_revenue: Диагностика бесплатна для клиента. Команда несёт затраты на аналитика
    и дизайнера, вклад до пилота не заложен.
- id: ALT-004
  title: Сохранить действующий процесс
  kind: status_quo
  description: Сохранить разделение пакета и обычную поддержку, без отдельного исследования.
  supported_by:
  - CLM-001
  - CLM-002
  - HYP-001
  objections:
  - text: Если предотвратимые семейные ограничения часты, обычный кабинет сохраняет
      задержку.
    refs:
    - HYP-001
  costs_revenue: Сохраняется базовый годовой прогноз, новый вклад и новые проектные
    затраты отсутствуют.
- id: ALT-005
  title: Закрыть инициативу новой помощи
  kind: kill
  description: Снять инициативу с плана до появления нового существенного свидетельства.
    Действующие услуги сохранить.
  supported_by:
  - CLM-004
  - HYP-003
  - HYP-004
  objections:
  - text: Если доступный поток достаточен, отказаться от дешёвой проверки означает
      упустить потенциальную пользу.
    refs:
    - HYP-003
  costs_revenue: Освобождается команда; затраты переназначения и цена упущенной пользы
    неизвестны.
