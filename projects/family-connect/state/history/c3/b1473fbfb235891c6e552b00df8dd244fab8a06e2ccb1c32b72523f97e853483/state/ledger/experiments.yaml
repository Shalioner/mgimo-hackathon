- id: EXP-001
  tests: [HYP-001, HYP-002]
  decision: DEC-001
  expected_change: Определены сценарии, где макет приводит к своевременному допустимому действию.
  metric: Своевременные правильные действия / пригодные тестовые сценарии. Отдельно фиксируем ошибки доступа, толкование сообщения, повторы и соседний номер.
  comparison: Одинаковые тестовые ситуации с макетом, ссылкой на действующий путь без предупреждения и текущим процессом. Порядок чередуется.
  duration: В согласованном окне диагностики Q1.
  effort: Отдельные проверки макета и контрактов в тестовом биллинге. Производственные операции требуют отдельного допуска.
  side_effects: [Чужие сведения после отказа или отзыва, Дубль операции, Исчерпание пакета у другого участника, Ошибка причины]
  stop_go: 'Стоп при нарушении роли, повторах, неверной квитанции или потере доступа другого участника. К допуску нужны чистые контроли макета и тестового биллинга. Если тестовый контур недоступен, остаётся проверка интерфейса.'
  owner: Дизайнер и владелец биллинга
- id: EXP-002
  tests: [HYP-003, HYP-004]
  decision: DEC-001
  expected_change: Известны доступность потока впервые подходящих семей, качество данных и смета возможного пилота.
  metric: Уникальные впервые пригодные семьи / календарная неделя; записи с известным итогом / пригодные записи. Раздельно задержка событий, подтверждения разрешений и переменные затраты.
  comparison: Единый фильтр по причинам, отдельно семейная и собственная ветки, сопоставимые временные окна. Источник агрегатов требует владельца и разрешения.
  duration: До решения Q1, после получения разрешённых агрегатов.
  effort: Спецификация выгрузки и сценарный расчёт. При отсутствии доступных агрегатов остаётся макет.
  side_effects: [Повторный счёт семьи, Смещение по тарифу или сроку, Отсутствие фактических исходов, Двойной учёт себестоимости]
  stop_go: 'К решению о пилоте нужны подтверждённые права, смета и темп не ниже расчётного; доля неизвестных исходов не выше 2% в пригодной выборке [CLM-026, CLM-027]. При неизвестной базе или темпе скорректировать проект до допуска.'
  owner: Продуктовый аналитик и владелец биллинга
- id: EXP-003
  tests: [HYP-001, HYP-004]
  decision: DEC-001
  expected_change: Рандомизация на уровне семьи даёт причинную оценку эффекта сигнала на ограничение связи в первом пригодном событии. Оплаченные месяцы анализируются отдельно после дозревания когорт.
  metric: Семьи с ограничением у номера первого события за 7 дней и семьи с ограничением у любого участника за 30 дней. Знаменатель каждого показателя — все назначенные семьи в ветви.
  comparison: Сигнал со ссылкой на действующий путь против обычного обслуживания при том же первом событии, с одним назначением на семью.
  duration: 7 дней для первичного исхода, 30 дней для риска всей семьи, оплаченные месяцы до конца планового года.
  effort: Только после отдельного допуска пилота, подтверждения потоков, сметы и проверок доступа.
  side_effects: [Раскрытие сведений, Дубль вычета, Ограничение у другого участника, Ложный сигнал, Неизвестные исходы после отзыва]
  stop_go: 'Стоп при подтверждённом инциденте или росте семейного риска с интервалом выше нуля [CLM-026]. Go — отдельное решение об охвате после достижения выборки, подтверждения пользы и семейной безопасности, а также положительной экономики созревших когорт; порог безубыточности M08 — 120 месяцев в основном сценарии [CLM-018, CLM-026]. Hold при незрелых данных. При подтверждённом неположительном вкладе расширение отклоняется.'
  owner: Руководитель продукта и продуктовый аналитик
