- id: CLM-026
  type: interpretation
  statement: 'Предлагаемый протокол EXP-003: первичный итог за 7 дней от триггера.
    3 п.п. — эффект для расчёта, 5% — двусторонний уровень значимости, 80% — мощность
    обнаружения этого эффекта против нуля. Для сигнала пользы нижняя граница 95% интервала
    эффекта выше нуля. Отдельного порога 3 п.п. для точечной оценки нет. При наличии
    пропусков вывод о пользе должен сохраняться при крайних сценариях. До допуска
    проверить долю неизвестных исходов: не выше 2% на пригодной выборке. Семейная
    метрика безопасности за 30 дней — группы с ограничением у любого участника среди
    всех назначенных в ветвь. Допустимая верхняя граница роста — ниже 2 п.п. по двустороннему
    95% интервалу. Если нижняя граница роста выше 0, пилот приостанавливается. Это
    предлагаемые правила, не наблюдения.'
  derived_from:
  - CLM-009
  - CLM-012
  evidence:
  - source: SRC-001
    locator: стр. 7–8 PDF, предупреждения о вреде и статистическая неопределённость;
      границы предлагает агент
  confidence:
    level: medium
    rationale: Проект протокола до проверки доступности данных.
