- id: ALT-001
  title: Переписать синхронизацию
  kind: invest
  description: Квартал разработки на новый движок синхронизации.
  supported_by: [HYP-001, HYP-003]
  objections:
    - text: Жалобы на синхронизацию могут отражать только платных пользователей, а не причину ухода большинства.
      refs: [CLM-002]
    - text: Квартал разработки без новой ценности, пока конкурент наращивает бесплатное предложение.
      refs: [CLM-003]
  scores:
    влияние на удержание: {value: 4, rationale: При верной HYP-001, refs: [HYP-001]}
    стоимость: {value: 2, rationale: Квартал команды, refs: [HYP-003]}
- id: ALT-002
  title: Сменить позиционирование на семейные общие блокноты
  kind: change
  description: Перестроить сообщение и онбординг вокруг совместной работы семьи.
  supported_by: [HYP-002]
  objections:
    - text: Доказательство потребности только синтетическое; конкурент Б уже занимает это позиционирование.
      refs: [CLM-005]
  scores:
    влияние на удержание: {value: 3, rationale: "Неизвестно, гипотеза слабая", refs: [HYP-002]}
    стоимость: {value: 4, rationale: В основном маркетинг и онбординг}
- id: ALT-003
  title: Оставить как есть
  kind: status_quo
  description: Не менять продукт, наблюдать за удержанием ещё квартал.
  objections:
    - text: Удержание падает четыре месяца подряд; ожидание продолжит потери.
      refs: [CLM-001]
- id: ALT-004
  title: Заморозить развитие и перевести пользователей на партнёрский сервис
  kind: kill
  description: Прекратить инвестиции, сохранить поддержку, предложить миграцию.
  objections:
    - text: Нет данных об экономике сервиса, чтобы считать его убыточным; закрытие может быть преждевременным.
