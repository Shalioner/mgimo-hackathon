- id: CLM-001
  type: fact
  statement: Удержание D30 упало с 31% в июне до 24% в сентябре 2026.
  evidence:
    - source: SRC-001
      locator: строки 2026-06 и 2026-09, столбец d30_retention_pct
  as_of: 2026-09-30
  confidence: {level: high, rationale: "Продуктовая аналитика, полный период"}
- id: CLM-002
  type: fact
  statement: 34% обращений в поддержку касаются медленной или несработавшей синхронизации.
  evidence:
    - source: SRC-002
      quote: "Синхронизация между устройствами медленная или не срабатывает: 34% обращений."
  as_of: 2026-09-30
  confidence: {level: medium, rationale: "Точная цифра, но выборка смещена к платным пользователям"}
  limitations: Доля обращений ≠ доля пользователей.
- id: CLM-003
  type: fact
  statement: Конкурент А с августа 2026 года даёт 15 ГБ бесплатного хранилища.
  evidence:
