    комбинации с мессенджерами/минутами — 788/799/988 ₽ в день.'
  evidence:
  - source: SRC-007
    quote: Плата в дни пользования 599 ₽
  - source: SRC-007
    quote: 2 ГБ Интернет в популярных странах
  - source: SRC-007
    quote: 1 ГБ Интернет в остальных странах
  - source: SRC-007
    quote: Включает плату за мессенджеры и интернет. 788 ₽
  - source: SRC-007
    quote: Включает плату за оба пакета — интернета и минут. 799 ₽
  - source: SRC-007
    quote: Включает плату за все 3 пакета — интернета, мессенджеров и минут. 988 ₽
