- id: CLM-013
  type: fact
  statement: 'Выездной турпоток россиян растёт: в новогодние праздники за рубеж выехало
    на 11% больше, чем годом ранее; поездки в Китай выросли в 10 раз, в Европу — на
    8,5% (данные аналитиков МегаФона по обезличенным данным абонентов).'
  evidence:
  - source: SRC-004
    quote: В минувшие новогодние праздники за рубеж выехало на 11% больше россиян
      в сравнении с прошлогодними зимними каникулами. Наряду с ростом поездок в Китай
      (в 10 раз) и другие азиатские государства, увеличилось количество посетивших
      европейские страны – на 8,5%. Такие выводы сделали аналитики МегаФона на основе
      обезличенных данных абонентов в роуминге.
  as_of: '2026-11-10'
  confidence:
    level: medium
    rationale: Цитата аналитиков самого МегаФона в отраслевом СМИ; период (какой именно
      год) в сводке не уточнён
- id: CLM-014
  type: interpretation
  statement: Российские операторы (МТС, Билайн) уже отвечают на eSIM-угрозу собственными
    travel eSIM-продуктами, доступными абонентам всех операторов; МегаФон в выборке
    источников такого продукта не показал.
  derived_from:
  - CLM-004
  - CLM-006
  confidence:
    level: medium
    rationale: Запуски подтверждены источниками; отсутствие продукта МегаФона — негативный
      вывод по ограниченной выборке источников, может быть неполнотой поиска
  limitations: Отсутствие упоминания ≠ отсутствие продукта; нужен прямой поиск по
    megafon.ru.
