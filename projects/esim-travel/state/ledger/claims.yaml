- id: CLM-001
  type: fact
  statement: Глобальная выручка от travel eSIM-пакетов достигнет $1,8 млрд к концу
    2025 года, рост на 85% с $989 млн в 2024-м (прогноз Juniper Research).
  evidence:
  - source: SRC-001
    quote: revenue from travel embedded SIM (eSIM) packages will reach $1.8 billion
      by the end of 2025; growing 85% from $989 million in 2024
  as_of: '2025-10-07'
  confidence:
    level: high
    rationale: Отраслевой аналитик, публикация с методологией; но это прогноз на конец
      года, не фактический итог
  limitations: Прогноз, а не отчётный факт; определения рынка у аналитиков расходятся
    (Kaleido давала $3,3 млрд на 2025).
