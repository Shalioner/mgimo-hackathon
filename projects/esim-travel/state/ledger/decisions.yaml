# Решения проекта esim-travel
- id: DEC-001
  question: "Запускать ли МегаФону travel eSIM для россиян за рубежом, и если да — в какой модели?"
  options: [ALT-001, ALT-002, ALT-003, ALT-004]
  criteria: [влияние на удержание, затраты и бюджет, скорость выхода, риск, обратимость]
  state: decided
  recommended: ALT-001
  chosen: ALT-001
  rationale: "Решение руководителя: запуск с пилотом (Турция/СНГ/ЮВА). Вариант прямо работает на цель удержания абонентов и строит собственную компетенцию; пилот ограничивает риск при неподтверждённом эффекте удержания (пробел Q4). Руководитель дополнительно потребовал перепроверить цены роуминга МегаФона по официальному сайту — CLM-009 заменён на CLM-015 (599 ₽/день за 2 ГБ, первоисточник SRC-007)."
  based_on: [CLM-001, CLM-002, CLM-004, CLM-006, CLM-008, CLM-014, CLM-015, HYP-001, HYP-004]
  rejected:
    - {option: ALT-002, reason: "Усиливает агрегаторов стратегически; клиентские отношения и данные уходят партнёру, компетенция не появляется"}
    - {option: ALT-003, reason: "Утечка продолжается при рынке +85%; промо сжигает маржу и не устраняет причину [CLM-001, CLM-008]"}
    - {option: ALT-004, reason: "Противоречит выбранной цели удержания абонентов"}
  decided_by: руководитель продукта
  decided_at: 2026-11-10
  owner: руководитель цифрового продукта
  metrics: [конверсия выезжающих абонентов в покупку travel eSIM, доля роуминг-интернет-трафика, удержанного своим продуктом, отток абонентов после зарубежных поездок, выручка travel eSIM на пилотных направлениях]
  review_triggers:
    - "Конверсия пилота ниже целевой в течение 2 месяцев после запуска"
    - "Стоимость/срок white-label-запуска хуже допущения HYP-004 (6 месяцев, малый бюджет)"
    - "Появление данных, что travel eSIM оператора не удерживает абонентов (закрытие Q4 в негативную сторону)"
    - "Конкуренты радикально меняют цены/модель (ответная реакция обязана быть оценена)"
    - "Разбор пилота EXP-002 — через 3 месяца после его старта (решение руководителя на C3); по его итогам go/no-go на масштабирование"
  review_by: 2027-03-10
