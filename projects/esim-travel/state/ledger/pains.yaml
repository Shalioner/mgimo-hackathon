      basis: []
      note: Не исследовалось
    gap:
      level: medium
      basis:
      - CLM-012
      note: Агрегаторы частично закрывают простотой покупки, но настройка двух карт
        остаётся
    measurability:
      level: medium
      basis: []
      note: Измеримо опросом и анализом обращений в поддержку
