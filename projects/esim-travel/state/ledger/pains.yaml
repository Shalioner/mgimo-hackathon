- id: PAIN-001
  segment: Российские туристы за рубежом (абоненты крупных операторов, в т.ч. МегаФона)
  statement: Интернет в роуминге дорогой и с непрозрачными списаниями; за тот же трафик
    агрегаторы берут в несколько раз меньше.
  criteria:
    frequency:
      level: high
      basis:
      - CLM-007
      - CLM-001
      note: 70 млн активаций travel eSIM в мире за 2024 — массовая практика обхода
        роуминга
    cost:
      level: high
      basis:
      - CLM-015
      - CLM-011
      note: 399 ₽/день или 999 ₽/ГБ против $9–18 за 5–10 ГБ; основания частично low-уверенные
    workarounds:
      level: medium
      basis:
      - CLM-011
      note: 'Обход есть и удобен: travel eSIM агрегаторов с оплатой МИР/рублями'
    gap:
      level: high
      basis:
      - CLM-008
      - CLM-002
      note: Текущие роуминг-пакеты операторов не закрывают боль — выручка сжимается,
        аналитики требуют отвечать продуктом
    measurability:
      level: high
      basis:
      - CLM-001
      - CLM-007
      note: Рыночные и операторные метрики доступны; для МегаФона — после внутренней
        проверки
  status: superseded
  superseded_by: PAIN-003
  updated: '2026-11-18'
  status_note: Сохранена история исходной оценки. Разница для сопоставимых пакетов
    неизвестна, требуется CHG-001.
