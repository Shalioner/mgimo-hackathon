# Варианты проекта esim-travel. Вопрос: запускать ли МегаФону travel eSIM для россиян за рубежом (цель — удержание абонентов)?
- id: ALT-001
  title: "Свой travel eSIM МегаФона на white-label/CaaS-платформе"
  kind: invest
  description: "Запустить travel eSIM под брендом МегаФона (в приложении, оплата рублями, цены уровня агрегаторов) на готовой платформе, целевой сегмент — выезжающие абоненты; старт с пилота по топ-странам (Турция, СНГ, ЮВА), полный запуск в течение года."
  supported_by: [HYP-001, HYP-002, HYP-004, CLM-002, CLM-003]
  objections:
    - text: "Нет прямых доказательств, что travel eSIM оператора удерживает абонентов — цель «удержание» не подтверждена ни одним кейсом с метриками (пробел Q4)."
      refs: [HYP-002]
    - text: "Конкуренты уже на рынке и заняли место «продукта по умолчанию»: МТС — с ноября 2024, Билайн запустил позднее; догонять дороже, чем быть первым."
      refs: [CLM-004, CLM-006]
    - text: "Каннибализация собственного роуминга — цены уровня агрегаторов размывают маржу действующих роуминг-пакетов."
      refs: [CLM-015]
  scores:
    влияние на удержание: {value: 4, rationale: "Единственный вариант с прямой интеграцией в приложение/номер; но эффект не подтверждён", refs: [HYP-002]}
    затраты и бюджет: {value: 3, rationale: "White-label дешевле своей платформы, но дороже партнёрства; оценка — допущение (HYP-004)"}
    скорость выхода: {value: 3, rationale: "~6 месяцев до пилота по допущению HYP-004"}
    риск: {value: 3, rationale: "Риск исполнения и каннибализации; компенсируется пилотом"}
    обратимость: {value: 4, rationale: "Пилот по странам можно остановить без системных последствий"}
- id: ALT-002
  title: "Партнёрство/дистрибуция агрегатора в приложении МегаФона"
  kind: change
  description: "Не строить продукт, а встроить travel eSIM партнёра (агрегатора или white-label-провайдера) в приложение и каналы МегаФона с долей выручки; быстрый выход, минимальный бюджет."
  supported_by: [HYP-001, CLM-003, CLM-010]
  objections:
    - text: "Усиливает агрегаторов стратегически: клиентские отношения и данные уходят партнёру, собственной компетенции не появляется; при расторжении — ничего не осталось."
      refs: [CLM-003]
    - text: "Не удерживает тех, кто уже привык покупать напрямую у агрегаторов: партнёрская витрина конкурирует с самим партнёром."
      refs: [CLM-007]
  scores:
    влияние на удержание: {value: 3, rationale: "Закрывает боль цены/удобства быстрее, но слабее интеграции с базой"}
    затраты и бюджет: {value: 5, rationale: "Минимальные вложения, rev-share модель"}
    скорость выхода: {value: 5, rationale: "Быстрый запуск на готовой платформе партнёра [CLM-003]"}
    риск: {value: 4, rationale: "Инвестиционный риск низкий; стратегический — зависимость от партнёра"}
    обратимость: {value: 5, rationale: "Расторжение соглашения"}
- id: ALT-003
  title: "Не запускать — оставить как есть (текущий роуминг + промо-меры)"
  kind: status_quo
  description: "Не запускать travel eSIM; удержание через действующие роуминг-пакеты и промо-акции (бонусный трафик в роуминге), мониторинг рынка."
  supported_by: [CLM-005, CLM-006]
  objections:
    - text: "Структурная утечка продолжится: рынок travel eSIM +85% за год, роуминговая выручка операторов сжимается; промо сжигает маржу, не устраняя причину."
      refs: [CLM-001, CLM-008]
    - text: "Конкуренты уже закрыли потребность своим продуктом — статус-кво делает МегаФон единственным крупным оператором без ответа."
      refs: [CLM-004, CLM-006, CLM-014]
  scores:
    влияние на удержание: {value: 2, rationale: "Причина ухода — цена/удобство против агрегаторов, промо её не закрывает"}
    затраты и бюджет: {value: 4, rationale: "Нет капзатрат; промо стоит маржой"}
    скорость выхода: {value: 5, rationale: "Ничего запускать не нужно"}
    риск: {value: 2, rationale: "Риск — продолжение утечки при росте рынка"}
    обратимость: {value: 5, rationale: "Всё остаётся как есть"}
- id: ALT-004
  title: "Осознанный отказ от сегмента travel-интернета"
  kind: kill
  description: "Решить не входить в travel eSIM вообще (до пересмотра), не инвестировать и не вести промо-активность в роуминге; фокус ресурсов на базовом рынке РФ."
  supported_by: []
  objections:
    - text: "Отказ закрепляет уход растущего сегмента: турпоток растёт, каждая поездка — точка контакта с качеством оператора; плохой интернет за рубежом — фактор смены оператора по возвращении."
      refs: [CLM-013]
    - text: "Противоречит заявленной цели удержания абонентов, выбранной руководителем на C1."
      refs: [HYP-001]
  scores:
    влияние на удержание: {value: 1, rationale: "Прямо противоречит цели удержания"}
    затраты и бюджет: {value: 5, rationale: "Ноль затрат"}
    скорость выхода: {value: 5, rationale: "Решение мгновенное"}
    риск: {value: 2, rationale: "Стратегический риск потери базы в растущем сегменте"}
    обратимость: {value: 3, rationale: "Вернуться можно, но время и компетенция будут потеряны"}
