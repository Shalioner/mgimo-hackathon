- id: PRM-003
  message: Цена известна заранее — пакет за фиксированную цену, без дневных списаний.
  audience: Абоненты МегаФона, сравнивающие с текущим роумингом [CLM-015]
  barrier: Непрозрачные списания блоками [CLM-012]
  feature: Фиксированные пакеты данных travel eSIM (ALT-001)
