# Обещания коммуникации проекта esim-travel
- id: PRM-001
  message: Интернет за границей по цене агрегаторов — прямо в приложении МегаФона.
  audience: Абоненты МегаФона, планирующие зарубежную поездку
  barrier: Недоверие к цене роуминга и незнание, что у МегаФона есть конкурентный продукт [CLM-011, CLM-004]
  feature: Travel eSIM в приложении, оплата рублями, цены уровня агрегаторов (ALT-001)
  proof: [EXP-002]
  channels: [пуш/СМС по триггеру поездки, приложение и сайт, PR о запуске]
  decision: DEC-001
- id: PRM-002
