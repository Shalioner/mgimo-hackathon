# Эксперименты плана проверки проекта esim-travel
- id: EXP-001
  tests: [HYP-001]
  decision: DEC-001
  expected_change: Доля выезжающих абонентов, пользующихся travel eSIM агрегаторов, ≥10% (если ≥15% — утечка срочная).
  metric: доля выезжающих абонентов, купивших travel eSIM стороннего сервиса за 6 месяцев
  comparison: опрос случайной выборки выезжающих абонентов + самоотчёт, сверка с динамикой роуминг-трафика по направлениям [CLM-013]
  duration: 4 недели полевых работ, отчёт к концу месяца 2
  side_effects: [риск смещения выборки — отвечают более активные абоненты]
  stop_go: "go — доля ≥10%; if <5% — масштабирование ALT-001 под вопросом, пересмотр в пользу ALT-003"
  owner: продуктовый аналитик
- id: EXP-002
  tests: [HYP-002, HYP-005]
  decision: DEC-001
  expected_change: Конверсия выезжающих из пилотной группы в покупку travel eSIM МегаФона ≥3%, у покупателей повторная покупка в следующей поездке ≥50%, отток после поездки не выше контрольной группы.
  metric: конверсия в покупку, повторные покупки, отток после поездки
  comparison: контрольная группа выезжающих в те же страны без оффера (A/B), период до пилота как вторая база
  duration: "пилот (Турция, СНГ, ЮВА); промежуточные данные — через 6 недель; разбор пилота — через 3 месяца после старта (решение руководителя на C3)"
  side_effects: ["каннибализация роуминг-пакетов «на день» (CLM-015)", снижение роуминговой выручки без роста удержания, жалобы на активацию]
  stop_go: "go — конверсия ≥3% и отток ≤ контроль (HYP-005 проверяется той же связкой: эффект удержания из пилота × стоимость из EXP-003); stop/пересмотр — конверсия <1% или отток выше контроля, либо каннибализация >50% выручки пакетов на день"
  owner: руководитель цифрового продукта
  effort: интеграция пилота на white-label-платформе + маркетинг пилота; объём задаёт результат EXP-003
- id: EXP-003
  tests: [HYP-004]
  decision: DEC-001
  expected_change: Среди ≥3 white-label/CaaS-платформ есть предложение со сроком запуска ≤6 месяцев и интеграционными затратами в рамках малого бюджета (порог задаёт руководитель; ориентир — не дороже бюджета пилота направления роуминга).
  metric: срок до пилота и стоимость интеграции по коммерческим предложениям
  comparison: сопоставление ≥3 RFP-ответов между собой
  duration: 6 недель на RFP и выбор (месяцы 1–2)
  side_effects: [риски договора с единственным вендором — закладывать выходные условия]
  stop_go: "go — есть ≥1 предложение, укладывающееся в бюджет/срок; stop/пересмотр — все предложения дороже или дольше допущения → пересмотр в пользу ALT-002"
  owner: руководитель цифрового продукта
  effort: RFP силами команды закупок и продукта, без внешних затрат
