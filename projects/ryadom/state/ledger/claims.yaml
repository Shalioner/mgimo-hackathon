- id: CLM-013
  type: fact
  statement: Авторский отчёт о приватности детей 6–11 лет описывает интервью с 12
    семьями Oxfordshire и онлайн-опрос 250 родителей летом 2017 года.
  evidence:
  - source: SRC-007
    locator: Текстовые выдержки и контекст; оригинал Abstract, строки 16–20
    quote: we conducted face-to-face interviews with 12 families in Oxfordshire and
      an online survey with 250 parents.
  confidence:
    level: high
    rationale: Уверенность в корректной передаче документа или высказывания; не в
      переносе на «Рядом».
  limitations: Планшеты и онлайн-приватность, не семейная геолокация; интервью вне
    России, страна онлайн-опроса из аннотации не установлена; отчёт 2018 года.
  status: active
  as_of: '2026-11-10'
- id: CLM-014
  type: fact
  statement: Качественное исследование Дании основано на 17 интервью родителей, отобранных
    snowball sampling; возраст детей смешанный. Авторы обсуждают заботу, контроль,
    доверие и семейную координацию.
  evidence:
  - source: SRC-008
    locator: Текстовые выдержки и контекст; оригинал Methodological approach с.83–84,
      Analysis с.85–86
    quote: 17 cases were selected through a snowball sampling via Facebook
  confidence:
    level: high
    rationale: Уверенность в корректной передаче документа или высказывания; не в
      переносе на «Рядом».
  limitations: Материал 2017 года, публикация 2021; нерепрезентативная выборка, преимущественно
    образованные работающие родители. Не оценка России или отдельного сегмента 6–11
    лет.
  status: active
  as_of: '2026-11-10'
