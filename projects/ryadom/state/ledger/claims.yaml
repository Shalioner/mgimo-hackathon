    quote: Ребенок в школе , а программа показывает , что дома .
  confidence:
    level: low
    rationale: Уверенность в корректной передаче документа или высказывания; не в
      переносе на «Рядом».
  limitations: Факт наличия высказывания, не подтверждённый дефект. Страна, возраст,
