- id: CLM-001
  type: fact
  statement: В постановке учебного кейса «Рядом» — семейное приложение с геолокацией
    детей и уведомлениями.
  evidence:
  - source: SRC-001
    quote: У нас семейное приложение "Рядом" — родители видят геолокацию детей и получают
      уведомления.
  confidence:
    level: high
    rationale: Точно передаёт условия и слова руководителя, а не эмпирический результат.
  limitations: Факт о постановке учебного кейса; не доказательство реального поведения
    пользователей.
  status: active
