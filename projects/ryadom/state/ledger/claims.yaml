- id: CLM-005
  type: fact
  statement: Google документирует предварительное включение передачи геоданных и отсутствие
    геопозиции при выключенном устройстве или отсутствии интернета.
  evidence:
  - source: SRC-003
    locator: 'Текстовые выдержки и контекст; оригинал: настройка передачи и устранение
      неполадок, строки 23–38, 94–102'
    quote: необходимо сначала настроить передачу геоданных.
  confidence:
    level: high
    rationale: Уверенность в корректной передаче документа или высказывания; не в
      переносе на «Рядом».
  limitations: Условия работы Family Link; частота проблем и их наличие в «Рядом»
    неизвестны.
  status: active
  as_of: '2026-11-10'
