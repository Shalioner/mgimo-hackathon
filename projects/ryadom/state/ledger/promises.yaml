- id: PRM-001
  message: Геопозиция детского устройства — в «Рядом».
  audience: Родители детей 6–11 лет в России; только согласившиеся участники проверки,
    не рекламная аудитория
  barrier: 'Гипотеза HYP-002: общая карта может не объяснять конкретную семейную пользу;
    не доказанная причина ухода.'
  feature: F1 — просмотр геопозиции детского устройства (заявлено в CLM-001; фактическая
    работа требует EXP-002).
  proof:
  - CLM-001
  - EXP-002
  - EXP-003
  channels:
  - Статичный макет в добровольной исследовательской сессии; только после C3
  decision: DEC-001
  status: active
  status_note: 'Прежний черновик F1, текст и метод EXP-003 сохранены. После CHG-001
    DEC-001 decided/chosen ALT-006; сообщения остаются вспомогательными в прежних
    4 часах. Выпуск не разрешён; EXP-002 должен проверить функцию, EXP-003 проверяет
    понимание. Ограничения: не гарантия безопасности или подтверждение школьного прибытия;
    не создавать нового обещания платной пользы без состава функций.'
  updated: '2026-11-10'
