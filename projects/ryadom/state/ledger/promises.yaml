- id: PRM-001
  message: Геопозиция детского устройства — в «Рядом».
  audience: Родители детей 6–11 лет в России; только согласившиеся участники проверки,
    не рекламная аудитория
  barrier: 'Гипотеза HYP-002: общая карта может не объяснять конкретную семейную пользу;
    не доказанная причина ухода.'
  feature: F1 — просмотр геопозиции детского устройства (заявлено в CLM-001; фактическая
    работа требует EXP-002).
  proof:
  - CLM-001
  - EXP-002
  - EXP-003
  channels:
  - Статичный макет в добровольной исследовательской сессии; только после C3
  decision: DEC-001
  status: active
  status_note: 'Черновик для сравнения понимания после проверки EXP-002; EXP-003 проверяет
    текст, не подтверждает функцию. Общая оговорка в обоих макетах: «Позиция может
    быть недоступна без необходимых настроек, связи или питания устройства. Это не
    гарантия безопасности и не подтверждение прибытия в школу». До проверки функции
    не показывать как работающий сервис и не публиковать.'
