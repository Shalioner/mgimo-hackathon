- id: EXP-003
  tests:
  - HYP-002
  decision: DEC-001
  expected_change: Сообщение B лучше A объясняет семейную пользу при сохранении понимания
    ограничений. Проверяем понимание, а не спрос, конверсию или удержание. Числа и
    правила утверждены на C3 как дизайн плана [DEC-001, HYP-006], не результаты. Запуск
    зависит от подтверждения доступности продукта и добровольно согласившихся семей;
    закупки и внешние контакты в текущем прогоне не выполнялись.
  metric: 'Для каждой из 6 семей: корректный пересказ функции и её границ по заранее
    записанной рубрике, ожидание гарантированной безопасности/точности, выбор понятного
    сообщения. Корректно: позиция доступного устройства помогает ориентироваться;
    нет гарантии безопасности, непрерывной связи или подтверждения школьного прибытия.'
  comparison: 'Одинаковые статичные макеты и функция, различается только текст: A=PRM-001,
    B=PRM-002. После основной диагностики показать обоих в чередующемся порядке: 3
    семьи A→B, 3 B→A. Сначала свободный пересказ, затем вопросы об ограничениях; рубрику
    зафиксировать до ответов. Парное сравнение разведочное, не статистический A/B
    эксперимент.'
  duration: Жёсткий предел 4 человеко-часа всей вспомогательной ветки, включая макеты,
    показ и разбор; те же 6 семей без отдельного рекрутинга. Основная ветка использует
    собственные 20 часов; окно до 2026-11-24 [HYP-006].
  side_effects:
  - 'Эффект первого сообщения и перенос понимания между текстами: сохранять порядок
    и анализировать отдельно.'
  - Задача школы может внушить неподтверждённую функцию уведомления о прибытии; такой
    текст запрещён до технического подтверждения.
  - Нагрузка на ту же команду может задержать основную ветку.
  stop_go: GO только к следующей проверке текста B, если корректных пересказов B не
    менее 4 из 6 и минимум на 2 семьи больше, чем A, при 0 ложных ожиданий гарантированной
    безопасности/автоматического подтверждения прибытия после B. Иначе сохранять нейтральный
    текст или признать результат неопределённым. Если более понятный текст создаёт
    ложное обещание, STOP независимо от предпочтений. По достижении 4 часов или угрозе
    основной ветке остановить сообщения, не занимать её остаток. Никакой автоматической
    публикации победителя; связь с удержанием проверяется отдельно [HYP-006].
  owner: руководитель продукта или действующий автор текстов из прежней команды
  status: active
  status_note: 'План утверждён на C3 2026-11-10; не запускался, результатов нет. Наличие
