    прогоне не выполнялись.
  metric: Наличие оплаты; свободный пересказ цены, момента списания, оплаченных функций
    и условий отмены по собственным реальным материалам продукта. Цена не выдумывается,
    тестовых списаний нет.
  comparison: Сопоставить ответы тех же 6 родителей с фактическими условиями реальной
    версии; если возможно за оставшийся лимит — сравнить исходное описание с исправленным
    макетом, но не смешивать с EXP-003.
  duration: До 2 человеко-часов основной ветки, включая проверку применимости; в том
    же цикле до 2026-11-24 [HYP-006].
  side_effects:
  - Вопросы могут создать ожидание платы у бесплатного продукта.
  - Разбор тарифа способен отнять время у основного сценария; сначала проверка наличия
    оплаты.
  stop_go: Если оплаты нет — HYP-003 неприменима к текущей версии; отметить это результатом
    только после проверки собственных материалов. Если материалы недоступны — неизвестно,
    не refuted. При оплате и одинаковой ошибке хотя бы у 3 из 6 — GO к правке объяснения
    в проекте, а не к смене цены. При 0 ошибок ослабить гипотезу для выборки; при
    1–2 результат неопределённый. Без связи с моментом реального ухода причинность
    не подтверждается [HYP-006].
