- id: EXP-002
  tests:
  - HYP-001
  decision: DEC-001
  expected_change: Найти воспроизводимый барьер до первой актуальной позиции; если
    барьер найден, проверить целевое исправление в отдельном согласованном пилоте.
    Измерить вклад в ранний уход без событий реальных когорт нельзя. Числа и правила
    утверждены на C3 как дизайн плана [DEC-001, HYP-006], не результаты. Запуск зависит
    от подтверждения доступности продукта и добровольно согласившихся семей; закупки
    и внешние контакты в текущем прогоне не выполнялись.
  metric: 'В 6 семейных наблюдениях: завершение связи устройств, получение позиции,
    место остановки и воспроизводимость отказа. Критерий актуальности позиции для
    наблюдения: сверить обновление с текущим контролируемым действием на тестовых
    устройствах без сохранения координат; порог задержки определить до наблюдений
    по продуктовой задаче. D7: повторное семейное событие ценности в конце первой
    недели, точное окно и исходная когорта ещё не определены.'
  comparison: Наблюдать исходный путь до показа сообщений; отдельно технически воспроизвести
    найденный отказ в той же конфигурации. До/после целевого исправления — только
    при отдельном разрешении на разработку и новом предрегистрационном протоколе;
    это не проведённый A/B тест.
  duration: 'До 12 человеко-часов основной ветки в цикле до 2026-11-24; промежуточно
    после первых 3 наблюдений. Если останется время, уточнять воспроизведение, не
    добавлять новые функции [HYP-006]. Предложение по CHG-001: сократить до 4 часов
    адресной диагностики, высвободив время для EXP-004; до C2/C3 действует прежний
    план.'
  side_effects:
  - 'Наблюдатель помогает и меняет поведение: подсказки учитывать отдельно от самостоятельного
    прохождения.'
  - Запись экранов может раскрыть маршруты; не записывать адреса, координаты, имена,
    идентификаторы и контакты.
  - Исправление может ухудшить батарею/уведомления; до изменения определить контрольные
    проверки в допустимой тестовой среде.
  stop_go: Если один и тот же барьер наблюдается хотя бы у 3 из 6 семей и независимо
    воспроизводится на тестовых устройствах — GO только к оценке адресного исправления,
    не к масштабированию. Если 0 из 6 не достигают первой позиции — ослабить HYP-001
    для этой выборки и пересмотреть приоритет; при 1–2 или разнородных отказах вывод
    неопределённый, расширения выборки автоматически нет. При недоступной реальной
    версии или отсутствии определения актуальности — STOP проверки HYP-001; прототип
    даёт только сигналы удобства. Без когортных событий причина раннего ухода и влияние
    на D7 остаются неизвестны [HYP-006].
  owner: Продуктовый аналитик — назначен руководителем на C3 2026-11-10
  status: active
  status_note: 'План утверждён на C3 2026-11-10; не запускался, результатов нет. Наличие
