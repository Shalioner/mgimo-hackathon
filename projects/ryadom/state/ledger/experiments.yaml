- id: EXP-005
  tests:
  - HYP-004
  decision: DEC-001
  expected_change: Проверить, меняет ли понятное объяснение наблюдаемых данных и семейных
    границ понимание и принятие родителем и ребёнком. Не обещать доступных настроек
    доступа/хранения, пока они не проверены. Числа и правила утверждены на C3 как
    дизайн плана [DEC-001, HYP-006], не результаты. Запуск зависит от подтверждения
    доступности продукта и добровольно согласившихся семей; закупки и внешние контакты
    в текущем прогоне не выполнялись.
  metric: 'Раздельный добровольный пересказ родителем и ребёнком: что видно, кому
    и при каких ограничениях; готовность пользоваться до/после нейтрального объяснения.
    Собирать роли и агрегированные ответы без персональных данных; никаких маршрутов.'
  comparison: В тех же 6 семьях сравнить понимание и согласие до/после объяснения,
    основанного на проверенных свойствах продукта. Сначала EXP-003, затем этот блок,
    чтобы объяснение не улучшало пересказ B заранее. Результаты родителей и детей
    не объединять; ответы родителя не заменяют принятие ребёнком.
  duration: До 4 человеко-часов основной ветки, включая подготовку корректного объяснения;
    в том же цикле до 2026-11-24 [HYP-006].
  side_effects:
  - Ребёнок может соглашаться под давлением родителя; добровольность и возможность
    остановиться обязательны.
  - Непроверенные заявления о приватности могут усилить ложное доверие.
  - Участие ребёнка требует разрешения законного представителя и добровольного согласия
    самого ребёнка; без них детская часть не проводится.
  stop_go: GO к доработке объяснения, если понимание улучшилось в обеих ролях хотя
    бы у 4 из 6 семей и нет нового отказа/дискомфорта из-за давления или ложного обещания.
    При отсутствии изменения принятия не утверждать влияние на принятие. При непроверенных
    свойствах данных либо дискомфорте участника — STOP. Если доступна только родительская
    часть, детское принятие остаётся неизвестным; HYP-004 целиком не supported. Размеры
    и пороги — разведочные, не доказательство распространённости [HYP-006].
