- id: EXP-001
  tests:
  - HYP-005
  - HYP-006
  decision: DEC-001
  expected_change: Установить исполнимость проверки и совместимость сценария; 6 семей
    с поддерживаемым устройством — критерий комплектности пилота, не оценка доли таких
    семей в России. Числа и правила утверждены на C3 как дизайн плана [DEC-001, HYP-006],
    не результаты. Запуск зависит от подтверждения доступности продукта и добровольно
    согласившихся семей; закупки и внешние контакты в текущем прогоне не выполнялись.
  metric: Наличие допустимого продукта/прототипа, согласий, устройств, подтверждённого
    лимита времени и денежного расхода; доступно/недоступно по каждой позиции.
  comparison: Проверить заявленные условия плана по фактической доступности; совместимые
    и несовместимые конфигурации фиксировать раздельно. На прототипе HYP-005 остаётся
    непроверенной в части реального ношения устройства.
  duration: До 2 человеко-часов основной ветки в начале цикла до 2026-11-24 [HYP-006].
  side_effects:
  - Отбор только совместимых устройств создаёт смещение; не оценивать распространённость
    HYP-005 по отобранным семьям.
  - Рекрутинг может поглотить бюджет; без доступных согласившихся участников не начинать
    платный поиск.
  stop_go: GO к наблюдениям только при 6 добровольно согласившихся семьях, доступном
    допустимом продукте и подтверждении пределов 20+4=24 человеко-часа, денежный расход
    0. Если хотя бы один ресурсный пункт не подтверждён — STOP соответствующей проверки,
    пересмотр исполнимости с руководителем, без выдуманных наблюдений. Неподдерживаемые
    устройства не исключать молча из журнала причин недопуска; возможная доля в сегменте
    остаётся неизвестной [HYP-006].
  owner: руководитель продукта из прежней команды
  status: active
  status_note: План утверждён на C3 2026-11-10; не запускался, результатов нет. Наличие
