- id: EXP-004
  tests:
  - HYP-003
  decision: DEC-001
  expected_change: В октябрьском учебном кейсе наличие trial 7 дней и цены 299 ₽/месяц
    установлено [CLM-021]. Проверить понимание платной ценности, состава подписки
    и отличить непонимание от цены, нехватки пользы или поздних отказов. Прирост оплаты/удержания
    не прогнозируется; метод после CHG-001 предложен до C2/C3.
  metric: Свободный пересказ цены, срока trial, состава платной пользы и условий отмены.
    Для агрегированного аудита запросить определение D7, зрелость когорт, сегмент
    C1, знаменатели/численности, события отказа и конверсию trial→оплата с разбивкой
    по первой позиции и Android/iOS. Не собирать идентификаторы/координаты.
  comparison: 'Предложение: сначала проверить сопоставимость октябрьских когорт и
    построить агрегированную воронку первая позиция→конец trial→оплата→повторная польза.
    В рамках прежней выборки 6 семей сопоставить свободный пересказ текущего тарифа
    и уточнённого макета с реальным составом функций, не внушая причину ухода. Это
    не причинный тест. Дальнейший контрольный эксперимент требует отдельного протокола,
    зрелых когорт, размера выборки и отдельного разрешения на запуск.'
  duration: Исторически утверждено до 2 часов; предложение после CHG-001 — до 10 часов
    основной ветки за счёт сокращения EXP-002 с 12 до 4, общий предел 20+4=24 и разбор
    2026-11-24 сохраняются [DEC-001, HYP-006]. Перераспределение не утверждено.
  side_effects:
  - Вопросы могут создать ожидание платы у бесплатного продукта.
  - Разбор тарифа способен отнять время у основного сценария; сначала проверка наличия
    оплаты.
  stop_go: 'Предложение: без определений когорт, возрастного/географического среза
    и состава платных функций не делать вывод о C1 или причинности. При одинаковой
    ошибке понимания хотя бы у 3 из прежних 6 семей — только GO к проектированию уточнения,
    не к изменению цены/публикации. При 0 ошибок ослабить механизм непонимания для
    выборки, при 1–2 оставить неопределённым [HYP-006, прежний дизайн C3]. Если непонимание
    не подтверждается, отдельно исследовать цену, полезность и поздние отказы. До
    запуска влияния на D7/оплату предрегистрировать контроль, единицу рандомизации,
    окно, достаточность данных и допустимые нежелательные эффекты. Порог эффекта неизвестен;
    не выдумывать. Отсутствие данных — STOP причинных выводов, не refuted.'
