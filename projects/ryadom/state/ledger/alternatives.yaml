- id: ALT-001
  title: Диагностика и улучшение первой ценности
  kind: invest
  description: Направить следующий цикл на проверку подключения семьи, доступности
    устройства и первой актуальной позиции; исправлять только подтверждённые препятствия.
    Расширение функций и масштабирование отложить до результата проверки. Это поэтапное
    вложение в базовый сценарий, не обязательство потратить квартальный бюджет.
  supported_by:
  - CLM-001
  - CLM-003
  - CLM-005
  - CLM-009
  - CLM-015
  - HYP-001
  - HYP-003
  - HYP-005
  objections:
  - text: Если семьи уже получают рабочую позицию и уходят из-за отсутствия ценности
      или платёжного барьера, улучшение настройки не изменит удержание, а время на
      него отсрочит нужный поворот. Сначала надо проверить сам механизм, а не начинать
      переписывание.
    refs:
    - CLM-003
    - HYP-001
    - HYP-002
    - HYP-003
  costs_revenue: 'Неизвестны бюджет, стоимость диагностики и доработок, выручка и
    эффект на неё (G1–G3, CLM-003). Допущение конструкции варианта: вложения выдаются
    по этапам и прекращаются при отсутствии подтверждённого барьера; доступность ресурсов
    ещё не установлена. Денежный диапазон без оснований не назначается.'
  scores:
    Доказательность причины ухода:
      value: 4
      rationale: 'Оценочное суждение агента, не измерение: непосредственно проверяет
        механизм HYP-001; результата пока нет.'
      refs:
      - CLM-015
      - HYP-001
    Соответствие задаче семьи:
      value: 4
      rationale: 'Оценочное суждение агента, не измерение: проверяет получение уже
        заявленной ценности при условии наличия устройства.'
      refs:
      - CLM-001
      - HYP-005
    Возможное влияние на удержание:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: есть механизм влияния только
        при подтверждении ухода до первой ценности.'
      refs:
      - CLM-003
      - HYP-001
    Затраты и обратимость:
      value: 4
      rationale: 'Оценочное суждение агента, не измерение: этап диагностики позволяет
        остановиться до масштабной разработки; трудоёмкость неизвестна.'
      refs:
      - CLM-003
      - CLM-018
    Доверие и приватность:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: минимизация собираемых
        данных закладывается в проверку, принятие семьями неизвестно.'
      refs:
      - CLM-017
      - HYP-004
  status: active
- id: ALT-002
  title: Расширение функций
  kind: invest
  description: Сделать главным направлением новый полезный семейный сценарий за пределами
    текущей карты и уведомлений. Конкретную функцию сначала определить по незакрытой
    задаче семьи, затем прототипировать; не выдавать список функций конкурентов за
    доказанный спрос.
  supported_by:
  - CLM-001
  - CLM-004
  - CLM-016
  - HYP-002
  objections:
  - text: Если семья не завершает подключение или устройство недоступно, новая функция
      поверх геолокации не достигает пользователя. При неизвестных причинах ухода
      и спросе она увеличивает объём обязательств до проверки базового механизма.
    refs:
    - CLM-003
    - CLM-005
    - CLM-009
    - HYP-001
    - HYP-005
  costs_revenue: 'Неизвестны спрос, состав функции, разработка, поддержка и дополнительная
    выручка (G1–G4, CLM-003). Допущение: потребуется отдельный цикл исследования и
    разработки; денежный диапазон и окупаемость не определены.'
  scores:
    Доказательность причины ухода:
      value: 2
      rationale: 'Оценочное суждение агента, не измерение: проверка новой потребности
        не объясняет прежний уход без отдельного исследования.'
      refs:
      - CLM-003
      - HYP-001
    Соответствие задаче семьи:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: новый сценарий может отвечать
        задаче семьи, но сама задача ещё не подтверждена.'
      refs:
      - CLM-004
      - HYP-002
    Возможное влияние на удержание:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: влияние возможно при дефиците
        ценности; свидетельств этого нет.'
      refs:
      - CLM-003
      - CLM-016
    Затраты и обратимость:
      value: 2
      rationale: 'Оценочное суждение агента, не измерение: выбор функции и разработка
        предшествуют эффекту; стоимость неизвестна, обязательств больше, чем у диагностики.'
      refs:
      - CLM-003
      - CLM-018
    Доверие и приватность:
      value: 2
      rationale: 'Оценочное суждение агента, не измерение: обращение с данными новой
        функции ещё не спроектировано; это риск неопределённости, не доказанный вред.'
      refs:
      - CLM-017
      - HYP-004
  status: active
- id: ALT-003
  title: Позиционирование вокруг понятного семейного результата
  kind: change
  description: Проверить понятность конкретной задачи, например понимания прибытия
    ребёнка в школу, вместо общей карты. Менять обещание и путь знакомства только
    в пределах реально работающих возможностей «Рядом»; не запускать рекламу и не
    обещать безопасность или точность без подтверждения.
  supported_by:
  - CLM-001
  - CLM-004
  - CLM-016
  - CLM-017
  - HYP-002
  - HYP-004
  objections:
  - text: Ясное сообщение не исправит отсутствие актуальной позиции; более конкретное
      обещание может усилить разрыв ожиданий и опыта. Наличие надёжного уведомления
      о прибытии именно в «Рядом» не установлено.
    refs:
    - CLM-001
    - CLM-003
    - HYP-001
    - HYP-002
  costs_revenue: 'Неизвестны стоимость проверки сообщений, изменения пути знакомства
    и эффект на оплату/удержание (G1, G2, G4). Допущение: сначала проверяются сообщения
    без рекламного размещения и продуктовых обещаний сверх подтверждённых функций;
    это обратимо. Денежная оценка отсутствует.'
  scores:
    Доказательность причины ухода:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: проверяет механизм ожиданий
        HYP-002, но не техническую причину ухода.'
      refs:
      - HYP-001
      - HYP-002
    Соответствие задаче семьи:
      value: 4
      rationale: 'Оценочное суждение агента, не измерение: направлен на конкретный
        результат согласованного сегмента, его приоритет остаётся гипотезой.'
      refs:
      - CLM-004
      - HYP-002
    Возможное влияние на удержание:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: влияние возможно только
        при разрыве понимания, а не отказе базовой функции.'
      refs:
      - HYP-001
      - HYP-002
    Затраты и обратимость:
      value: 4
      rationale: 'Оценочное суждение агента, не измерение: проверку сообщения можно
        остановить до изменения продукта; это допущение дизайна проверки, не смета.'
      refs:
      - CLM-003
      - CLM-018
    Доверие и приватность:
      value: 4
      rationale: 'Оценочное суждение агента, не измерение: явно включает объяснение
        данных и семейных границ; эффект принятия ещё не установлен.'
      refs:
      - CLM-017
      - HYP-004
  status: active
- id: ALT-004
  title: Сохранить текущий курс
  kind: status_quo
  description: Оставить продукт и коммуникации без отдельной инициативы по причинам
    ухода, сохраняя текущую эксплуатацию. Это экономит усилия на изменение сейчас,
    но оставляет неопределённость о причине ухода и жизнеспособности.
  supported_by:
  - CLM-001
  - CLM-002
  - CLM-003
  - CLM-018
  objections:
  - text: Заявленный ранний уход остаётся без проверки. Даже если экономия изменений
      оправдана, без данных нельзя различить приемлемое использование по случаю и
      потерю ценности; цена бездействия неизвестна.
    refs:
    - CLM-002
    - CLM-003
    - CLM-018
  costs_revenue: Новых инициатив не предполагается; текущие обслуживание, выручка
    и потери неизвестны (G1–G2, CLM-003). Нельзя приравнять отсутствие разработки
    к нулевым расходам или прогнозировать темп падения.
  scores:
    Доказательность причины ухода:
      value: 1
      rationale: 'Оценочное суждение агента, не измерение: нового способа выяснить
        причину ухода не предусматривает.'
      refs:
      - CLM-003
    Соответствие задаче семьи:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: сохраняет заявленную геолокацию
        и уведомления, соответствие нужде не проверяет.'
      refs:
      - CLM-001
      - HYP-002
    Возможное влияние на удержание:
      value: 1
      rationale: 'Оценочное суждение агента, не измерение: целенаправленного механизма
        изменения удержания нет; это не прогноз дальнейшего падения.'
      refs:
      - CLM-002
      - CLM-003
    Затраты и обратимость:
      value: 4
      rationale: 'Оценочное суждение агента, не измерение: не создаёт обязательств
        по новой разработке, но оставляет неизвестные текущие затраты.'
      refs:
      - CLM-003
    Доверие и приватность:
      value: 2
      rationale: 'Оценочное суждение агента, не измерение: не снимает неизвестность
        принятия и обращения с данными.'
      refs:
      - CLM-017
      - HYP-004
  status: active
- id: ALT-005
  title: Заморозить развитие направления
  kind: kill
  description: Прекратить новые инвестиции в развитие, отдельно спланировав обязательства
    перед текущими семьями. Это мягкий вариант сворачивания; фактическое закрытие,
    отключение сервиса и удаление данных в эту задачу не входят.
  supported_by:
  - CLM-002
  - CLM-003
  - CLM-018
  - HYP-005
  objections:
  - text: Без экономики и проверки доступности базового сценария можно отказаться
      от исправимого продукта. Заморозка не доказывает отсутствие спроса и не устраняет
      автоматически обязательства перед текущими семьями.
    refs:
    - CLM-001
    - CLM-003
    - CLM-018
    - HYP-001
  costs_revenue: Можно ограничить новые вложения по решению владельца; размер экономии,
    остаточные расходы, обязательства и потерянная выручка неизвестны (G2, CLM-003).
    Заморозка не равна бесплатному закрытию; денежный диапазон не задан.
  scores:
    Доказательность причины ухода:
      value: 1
      rationale: 'Оценочное суждение агента, не измерение: ограничивает вложения,
        но не выясняет причину ухода.'
      refs:
      - CLM-003
      - CLM-018
    Соответствие задаче семьи:
      value: 2
      rationale: 'Оценочное суждение агента, не измерение: не улучшает задачу семьи;
        альтернативный способ решения и ценность текущего продукта неизвестны.'
      refs:
      - CLM-001
      - HYP-002
      - HYP-005
    Возможное влияние на удержание:
      value: 1
      rationale: 'Оценочное суждение агента, не измерение: не направлена на улучшение
        удержания; уместна при ином приоритете ограничения потерь.'
      refs:
      - CLM-003
      - CLM-018
    Затраты и обратимость:
      value: 3
      rationale: 'Оценочное суждение агента, не измерение: ограничивает новые обязательства,
        но восстановление развития и обслуживание могут требовать ресурсов.'
      refs:
      - CLM-003
      - CLM-018
    Доверие и приватность:
      value: 2
      rationale: 'Оценочное суждение агента, не измерение: потребуется отдельный порядок
        работы с семьями и данными; автоматически доверие не улучшает.'
      refs:
      - CLM-017
      - HYP-004
  status: active
