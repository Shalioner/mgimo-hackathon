# Маршрутизация: какой уровень модели берётся для какой задачи и как его включить в конкретной среде.
# Принцип: начинать с самого дешёвого уровня, который справляется, и подниматься только по сигналу неудачи.
# Уровни T0–T4 общие для всех сред; модели и способ переключения — в разделе environments.
# Читают tools/ledger.py route и tools/delegate.py. Калибруется по журналам прогонов (run_log.md).

tiers:
  T0:
    name: Код без LLM
    when: Проверки, подсчёты, поиск затронутых выводов, хэши, таблицы — всё, что можно сделать детерминированно.
  T1:
    name: Лёгкий
    when: Извлечение фактов и цитат из одного источника, классификация, разметка, сверка ссылок, форматирование.
    effort: [low]
  T2:
    name: Средний
    when: План исследования, сводка по нескольким источникам, черновики артефактов, тексты сообщений.
    effort: [medium, high]
  T3:
    name: Сильный
    when: Сравнение вариантов, стратегия, разрешение противоречий, пересмотр, если меняется ранжирование.
    effort: [high, xhigh]
  T4:
    name: Предельный (только эскалация)
    when: >-
      Только если T3 не справился по сигналам эскалации ИЛИ человек явно просит максимальную глубину
      для дорогого решения. Никогда не уровень по умолчанию.
    effort: [high, xhigh]

# effort у уровня — лестница: модель уровня стартует с первого значения; при неудаче (`route --failed T3@medium`)
# сначала следующий effort на той же модели (так советуют Anthropic и OpenAI), и только после последнего — уровень выше.
# Значения переводятся на уровни конкретной модели: Codex сообщает их сам (models.py scan), иначе — effort_levels
# из гайда вендора (knowledge/model_guides). max при переводе не подставляется: у GLM (только low и max) T2 → [low].
# Внутри уровня может быть несколько моделей (каталог: above — сильнее): ступени идут «effort → следующая модель уровня».

# max и ultra в лестницы не входят: цена задачи на max вырастает в разы по сравнению с medium (замеры — от 2–3×
# до десятков раз на длинных задачах), а агент на предельной глубине действует непредсказуемее (дольше «додумывает»
# и чаще делает лишние действия). Поэтому max — только с согласия человека и без инструментов записи; ultra (Codex:
# автоматическое делегирование подзадач) — не используется.
effort_policy:
  ask: [max]
  never: [ultra]

# Какие модели НЕ выбираются общими шаблонами: специализированные (домен, ограниченный доступ, превью).
# Слова ищутся в ID целиком (gpt-5.5-cyber → cyber). Явная классификация — knowledge/model_catalog.yaml.
model_selection:
  specialized_tokens: [cyber, security, rosalind, bio, med, medical, health, law, legal, fin, finance, codex, review,
                       vision, vl, omni, audio, realtime, tts, image, embed, embedding, exp, preview, guard, safety]

# Семейства моделей по уровням. Значение уровня:
#   строка — фиксированный ID или алиас (алиасы Claude haiku/sonnet/opus/fable сами указывают на последнюю версию);
#   [вариант, вариант…] — первый доступный в инвентаре (Mythos при доступе, иначе Fable); последний — запасной;
#   {pattern: glob | regex: …, pin: ID} — берётся НОВЕЙШАЯ версия из инвентаря машины (tools/models.py scan),
#   подходящая под шаблон; без инвентаря или совпадений — pin. Так новые версии (Fable 5.2 → 5.3, gpt-6.1 → 6.2)
#   подхватываются без правки файла, а `tools/models.py check` сообщает о них; `models.py apply` обновляет pin.
#   Модели с другим именем (gpt-betelgeuse) попадают в уровень через knowledge/model_catalog.yaml (family, tier, replaces).
# inventory — из какого источника инвентаря брать модели семейства (модель из ZCode недоступна в Codex).
# null — уровень не задан: соседний уровень или текущая модель. Правила промптинга по вендорам — knowledge/model_guides/.
families:
  claude:   # Claude Code: алиасы --model / model: (за прокси — см. routing.local); Mythos — только при доступе организации
    {T1: haiku, T2: sonnet, T3: opus, T4: [{pattern: "claude-mythos-*"}, fable]}
  openai:   # Codex; ID из ~/.codex/models_cache.json
    inventory: codex
    T1: {pattern: "gpt-*-luna",  pin: gpt-6-luna}
    T2: {pattern: "gpt-*-terra", pin: gpt-6.1-terra}
    T3: {pattern: "gpt-*-sol",   pin: gpt-6.1-sol}
    T4: {pattern: "gpt-*-astra", pin: gpt-6-astra}
  opencode: # OpenCode Zen (платные); ID из `opencode models`
    inventory: opencode
    T1: {pattern: "opencode/claude-haiku-*",  pin: opencode/claude-haiku-5-5}
    T2: {pattern: "opencode/claude-sonnet-*", pin: opencode/claude-sonnet-5-5}
    T3: {pattern: "opencode/claude-opus-*",   pin: opencode/claude-opus-5-5}
    T4: {pattern: "opencode/claude-fable-*",  pin: opencode/claude-fable-5-2}
  glm:      # ZCode (Z.ai); ID из ~/.zcode/v2/config.json и встроенного конфига ZCode; T4 нет
    inventory: zcode
    T1: {regex: "^GLM-\\d+(\\.\\d+)?-Flash$", pin: GLM-5.3-Flash}
    T2: {regex: "^GLM-\\d+(\\.\\d+)?-Flash$", pin: GLM-5.3-Flash}
    T3: {regex: "^GLM-\\d+(\\.\\d+)?$",       pin: GLM-5.3}
    T4: null
  opencode-free: # бесплатные Zen: квоты по IP, состав меняется
    inventory: opencode
    T1: {pattern: "opencode/deepseek-*-flash-free", pin: opencode/deepseek-v4.1-flash-free}
    T2: {pattern: "opencode/deepseek-*-flash-free", pin: opencode/deepseek-v4.1-flash-free}
    T3: {pattern: "opencode/deepseek-*-flash-free", pin: opencode/deepseek-v4.1-flash-free}
    T4: null
  gigachat: {T1: null, T2: null, T3: null, T4: null}       # GigaCode: уточнить линейку

# Среды из ТЗ. switch — как включить модель нужного уровня, от лучшего способа к запасному:
#   subagent — встроенный субагент с моделью (лучше всего: дёшево, без участия человека);
#   cli      — делегирование подзадачи через tools/delegate.py (любая среда с терминалом);
#   picker   — агент в начале шага просит человека выбрать модель в интерфейсе;
#   current  — выполнить текущей моделью и записать «рекомендован Tx, выполнен на <модель>».
environments:
  claude-code:
    capability: reviewed_subscription_profile
    family: claude
    switch: [subagent, cli, current]
    how: "Claude Code subscription: tools/delegate.py --host claude-code --preflight. Нужен отдельный reviewed CLAUDE_CONFIG_DIR с native claude.ai login, allowlist model/effort и подтверждённым отключением extra usage. API/env/прокси не наследуются; unknown profile — manual. Основной чат выбирает пользователь через /model."
  codex:
    capability: reviewed_subscription_profile
    family: openai
    switch: [subagent, cli, current]
    how: "Codex ChatGPT: tools/delegate.py --host codex --preflight. Исполнение через отдельный явно проверенный subscription profile; неизвестный профиль остаётся manual. Основной чат — модель из ~/.codex/config.toml или /model. Наличие CLI или API key не разрешает запуск."
  opencode:
    family: opencode
    switch: [cli, current]
    how: "tools/delegate.py --backend opencode (opencode run -m <provider/model>); можно описать агентов с моделью в конфиге OpenCode."
  cursor:
    family: null
    switch: [picker, current]
    model_preferences: [Composer, Grok]
    model_allowlist: []
    capability: manual
    how: "Только явный picker и подтверждённый allowlist точных моделей/плана/контекста; предпочтения Composer/Grok не подтверждают entitlement или бесплатность. Auto/Balance/Intelligence и чужой CLI не fallback. Unknown quota/overage — manual."
  copilot:
    family: openai
    switch: [picker, cli, current]
    how: "Выбор модели в чате GitHub Copilot; подзадачи — через tools/delegate.py, если доступен CLI."
  windsurf:
    family: claude
    switch: [picker, cli, current]
    how: "Выбор модели в интерфейсе Windsurf; подзадачи — через tools/delegate.py, если доступен CLI."
  zcode:
    capability: manual
    family: glm
    switch: [picker, cli, current]
    how: "ZCode (Z.ai): модель выбирается в приложении. Модели видны только при активном провайдере: «Z.ai API» (оплата по токенам; модели выбираются в provider_config.json → personalModelIds), Start Plan (бесплатный, с дневной квотой — активируется пользователем в приложении) или Coding Plan. Проверено 2026-11-10: ZCode.app 0.17.1 содержит только безынтерфейсный CLI (glm/zcode.cjs: -p, app-server) без пакета @zcode/tui — через Orca ZCode не запускается — только в самом приложении ZCode (подтверждено пользователем); CLI вне приложения требует ELECTRON_RUN_AS_NODE=1 и ZCODE_BUILTIN_PROVIDER_CONFIG_FILE. T4 в линейке нет."
  deepseek-harness:
    family: null
    switch: [picker, current]
    capability: manual
    how: "DeepSeek Harness (dsh): headless/auth/billing contract не проверен; подписка чата не разрешает inference."
  kimi:
    family: null
    switch: [picker, current]
    capability: manual
    how: "Kimi Code OAuth отдельно от Moonshot API; API env может перекрыть настройки. Enforcement неизвестен."
  qwen:
    family: null
    switch: [picker, current]
    capability: manual
    how: "Qwen Code: Qwen Account отдельно от API; version/auth/effort contract неизвестен."
  gemini-cli:
    family: null
    switch: [picker, current]
    capability: manual
    how: "Google login отдельно от API/Vertex; нужна проверенная auth/config isolation, env autodetection не разрешает API."
  antigravity:
    family: null
    switch: [picker, current]
    capability: manual
    how: "Antigravity App/CLI: отдельный host, не Gemini CLI; версия, auth и billing enforcement неизвестны."
  antigravity-ide:
    family: null
    switch: [picker, current]
    capability: manual
    how: "Antigravity IDE: только ручной выбор после проверки плана, квоты и overage."
  gigacode:
    family: gigachat
    switch: [picker, current]
    how: "Выбор модели GigaChat в интерфейсе GigaCode. Линейка по уровням не проверена — при первом запуске записать в families.gigachat."
  kodik:
    family: null
    switch: [picker, current]
    how: "Возможности выбора модели не проверены — работать текущей моделью и записывать рекомендованный уровень в журнал."
  orca:
    family: openai
    switch: [cli, current]
    how: "Как codex; дополнительно — воркер Orca: orca orchestration worker-start --agent codex --model <id> (оркестратор, необязателен)."

# Модель решений (decision model): выбор из вариантов, шкала, да/нет с вероятностями, без генерации текста.
# Протокол System One (POST {base_url}/systemone). Выбор только после общего execution_policy gate;
# ни одного — tools/decide.py вернёт код 3, и задача идёт на T1, как раньше. Ключи — только в переменных окружения.
# Свой сервер с открытой моделью (Kev, Clef…) — в routing.local.yaml (см. пример). Ответы ниже min_confidence
# и отказы уходят на проверку T1 — экономия получается на уверенных ответах, а не на всех.
decision:
  min_confidence: 0.75
  # Нет ни одного провайдера (нет ключа/денег) — тот же протокол на дешёвой LLM (T1 через delegate.py, effort low).
  # Её «вероятности» — самооценка, поэтому порог строже. llm | none.
  fallback: llm
  emulation_min_confidence: 0.85
  providers:
    - {name: openrouter, base_url: "https://openrouter.ai/api/v1", model: typesafe/jev-1.13, api_key_env: OPENROUTER_API_KEY}
    - {name: requesty,   base_url: "https://router.requesty.ai/v1", model: typesafe/jev-1.13.0, api_key_env: REQUESTY_API_KEY}
  questions:   # готовые наборы вопросов → knowledge/decisions/*.yaml
    classify: claim_type
    verify-claims: source_supports
    route: route_tier
    intent: intent
    source-intake: suspicious_command

# Первый host — рекомендация. Ошибка/квота не переключает account/provider.
delegate_backends: [codex]

# Наличие CLI, ключа, inventory или legacy local config не даёт права вызова.
# Codex/Claude: явно проверенные subscription profiles; остальные CLI manual.
execution_policy:
  mode: subscription_only
  max_input_bytes: 128000
  codex_subscription:
    enabled: false
  claude_subscription:
    enabled: false
  api:
    enabled: false
    grants: []

# Задача → стартовый уровень.
tasks:
  validate:          {tier: T0, note: "ledger.py validate"}
  impact:            {tier: T0, note: "ledger.py impact — какие выводы затронуты, решает граф"}
  stats:             {tier: T0}
  table-calc:        {tier: T0, note: "расчёты по таблицам — Python, а не модель"}
  extract-claims:    {tier: T1, note: "по одному источнику; субагент source-extractor или delegate.py"}
  verify-claims:     {tier: T1, note: "сначала tools/verify.py (T0), затем строки check — tools/decide.py (source_supports), модель T1 — только сомнительные"}
  classify:          {tier: T1, note: "сначала tools/decide.py (модель решений), на T1 — только сомнительные ответы"}
  synthetic-interview: {tier: T1, note: "модельный респондент — дёшево, результат только гипотезы"}
  problem-framing:   {tier: T2}
  research-plan:     {tier: T2}
  situation-map:     {tier: T2}
  interview-analysis: {tier: T2}
  comms-strategy:    {tier: T2, note: "T3, если барьер не очевиден из данных"}
  validation-plan:   {tier: T2}
  alternatives:      {tier: T3}
  product-strategy:  {tier: T3}
  impact-revision:   {tier: T2, note: "пересмотр при новых данных: замер — T2 (Terra) $0,30 против $0,81–1,02 на T3 (Sol) при том же эталоне 6/6; T3 — если T2 не прошёл verify --change/validate или человек отклонил пересмотр; смену выбора всё равно решает человек на C2"}
  revise-lines:      {tier: T2, note: "tools/revise_lines.py: устаревшие строки после пересмотра — дешёвой моделью по короткому заданию"}
  # Синонимы: названия навыков из skills/ (агенты часто спрашивают маршрут по навыку)
  source-intake:     {tier: T1, note: "= extract-claims"}
  claim-verifier:    {tier: T1, note: "= verify-claims"}
  interviews:        {tier: T2, note: "гайд и анализ — T2; модельные респонденты — synthetic-interview (T1)"}
  strategy:          {tier: T3, note: "продуктовая — T3, коммуникационная — comms-strategy (T2)"}
  impact-analysis:   {tier: T0, note: "поиск затронутого — ledger.py impact; переписывание — impact-revision (T3)"}
  decision-support:  {tier: T2}
  self-audit:        {tier: T2, note: "skills/self-audit: человек отклонил результат по существу — найти сломанное основание через trace; эскалация, только если отклонение повторилось после аудита"}

# Сигналы, по которым уровень поднимается на одну ступень (и только на одну).
escalate_when:
  - validate выдаёт ошибки после 2 попыток исправления на текущем уровне
  - claim-verifier — claim support rate ниже 80% или есть overstated-утверждения после исправления
  - противоречие между источниками не разрешено и влияет на выбор варианта
  - человек на checkpoint отклонил результат по существу (не по стилю) второй раз — после самоаудита (skills/self-audit)
  - варианты получились несодержательно разными (вариации одного действия)
  - делегированный результат T1/T2 не прошёл проверку основной моделью
  - проверка готовности (decide.py --gate) не пройдена после 2 исправлений

deescalate_when:
  - задача следующего шага имеет более низкий стартовый уровень — вернуться к нему
  - эскалация разовая — не оставлять дорогую модель «на всякий случай»

budget:
  max_t4_calls: 2         # больше — только с согласия человека
  ask_before_t4: true     # перед T4 сообщить человеку причину и спросить
