# Маршрутизация: какой уровень модели берётся для какой задачи.
# Принцип: начинать с самого дешёвого уровня, который справляется, и подниматься только по сигналу неудачи.
# Читает tools/ledger.py route. Меняется при калибровке по журналам прогонов (run_log.md).

tiers:
  T0:
    name: Код без LLM
    claude: null
    openai: null
    when: Проверки, подсчёты, поиск затронутых выводов, хэши, таблицы — всё, что можно сделать детерминированно.
  T1:
    name: Лёгкий
    claude: Haiku
    openai: Luna
    when: Извлечение фактов и цитат из одного источника, классификация, разметка, сверка ссылок, форматирование.
  T2:
    name: Средний
    claude: Sonnet
    openai: Terra
    when: План исследования, сводка по нескольким источникам, черновики артефактов, тексты сообщений.
  T3:
    name: Сильный
    claude: Opus
    openai: Sol
    when: Сравнение вариантов, стратегия, разрешение противоречий, пересмотр, если меняется ранжирование.
  T4:
    name: Предельный (только эскалация)
    claude: Fable
    openai: Astra
    when: >-
      Только если T3 не справился по сигналам эскалации ИЛИ человек явно просит максимальную глубину
      для дорогого решения. Никогда не уровень по умолчанию.

# Задача → стартовый уровень. Если среда не даёт выбрать модель (одна модель на чат),
# задача выполняется текущей моделью, а в журнале фиксируется «рекомендован Tx, выполнен на <модель>».
tasks:
  validate:          {tier: T0, note: "ledger.py validate"}
  impact:            {tier: T0, note: "ledger.py impact — какие выводы затронуты, решает граф"}
  stats:             {tier: T0}
  table-calc:        {tier: T0, note: "расчёты по таблицам — Python, а не модель"}
  extract-claims:    {tier: T1, note: "по одному источнику; субагент source-extractor"}
  verify-claims:     {tier: T1, note: "субагент claim-verifier"}
  classify:          {tier: T1}
  synthetic-interview: {tier: T1, note: "модельный респондент — дешёво, результат только гипотезы"}
  problem-framing:   {tier: T2}
  research-plan:     {tier: T2}
  situation-map:     {tier: T2}
  interview-analysis: {tier: T2}
  comms-strategy:    {tier: T2, note: "T3, если барьер не очевиден из данных"}
  validation-plan:   {tier: T2}
  alternatives:      {tier: T3}
  product-strategy:  {tier: T3}
  impact-revision:   {tier: T3, note: "переписывание затронутых выводов; если ранжирование не меняется — T2"}

# Сигналы, по которым уровень поднимается на одну ступень (и только на одну).
escalate_when:
  - validate выдаёт ошибки после 2 попыток исправления на текущем уровне
  - claim-verifier — claim support rate ниже 80% или есть overstated-утверждения после исправления
  - противоречие между источниками не разрешено и влияет на выбор варианта
  - человек на checkpoint отклонил результат по существу (не по стилю) второй раз
  - варианты получились несодержательно разными (вариации одного действия)

# Когда опускаться обратно.
deescalate_when:
  - задача следующего шага имеет более низкий стартовый уровень — вернуться к нему
  - эскалация разовая — не оставлять дорогую модель «на всякий случай»

# Бюджет на проект по умолчанию (меняется в брифе по согласованию с человеком).
budget:
  max_t4_calls: 2         # больше — только с согласия человека
  ask_before_t4: true     # перед T4 сообщить человеку причину и спросить
