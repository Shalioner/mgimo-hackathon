# Пример локальных переопределений маршрутизации. Скопируйте в knowledge/routing.local.yaml (файл в .gitignore)
# и оставьте только то, что отличается на вашей машине. Объединяется с routing.yaml поверх него.

# 1) Claude Code через прокси (ANTHROPIC_BASE_URL): алиасы haiku/sonnet/opus разрешает прокси.
#    Пропишите, какие модели прокси реально отдаёт на каждый уровень (ID — из настроек вашего прокси).
# families:
#   claude: {T1: "<дешёвая модель прокси>", T2: "<средняя>", T3: "<сильная>", T4: null}

# 2) OpenCode только на бесплатных моделях (Zen free; квоты по IP, состав меняется — сверяйте `opencode models`):
# environments:
#   opencode: {family: opencode-free}
# delegate_families:
#   opencode: opencode-free

# 3) Свой лимит эскалаций:
# budget: {max_t4_calls: 0}

# 4) Своя (self-hosted) модель: любой OpenAI-совместимый сервер — Ollama, vLLM, LM Studio, корпоративный шлюз.
#    Удобно для массовых T1-задач (классификация, оценка по признакам) и когда данные нельзя отдавать в облако.
#    Ключ — только в переменной окружения (имя в api_key_env), не в файле. Модели сервера попадут в инвентарь
#    при `tools/models.py scan` (GET {base_url}/models). Effort передаётся как reasoning_effort (send_effort: false — не передавать).
# selfhosted:
#   base_url: http://localhost:11434/v1      # Ollama; vLLM обычно http://localhost:8000/v1
#   api_key_env: SELFHOSTED_API_KEY          # необязательно
#   send_effort: false
# families:
#   selfhosted: {inventory: selfhosted, T1: "qwen3:8b", T2: null, T3: null, T4: null}
# delegate_backends: [selfhosted, codex, claude, opencode]   # сначала своя модель

# 5) Модель решений на своём сервере (открытые аналоги Jev с тем же протоколом System One, например Kev):
#    поставьте свой провайдер первым. Ключ не нужен, если сервер локальный.
# decision:
#   providers:
#     - {name: kev-local, base_url: "http://localhost:8080/v1", model: kev-4b}
#     - {name: openrouter, base_url: "https://openrouter.ai/api/v1", model: typesafe/jev-1.13, api_key_env: OPENROUTER_API_KEY}
