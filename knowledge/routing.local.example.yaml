# Пример локальных переопределений маршрутизации. Скопируйте в knowledge/routing.local.yaml (файл в .gitignore)
# и оставьте только то, что отличается на вашей машине. Объединяется с routing.yaml поверх него.

# 1) Claude Code через прокси (ANTHROPIC_BASE_URL): алиасы haiku/sonnet/opus разрешает прокси.
#    Пропишите, какие модели прокси реально отдаёт на каждый уровень (ID — из настроек вашего прокси).
# families:
#   claude: {T1: "<дешёвая модель прокси>", T2: "<средняя>", T3: "<сильная>", T4: null}

# 2) OpenCode только на бесплатных моделях (Zen free; квоты по IP, состав меняется — сверяйте `opencode models`):
# environments:
#   opencode: {family: opencode-free}
# delegate_families:
#   opencode: opencode-free

# 3) Свой лимит эскалаций:
# budget: {max_t4_calls: 0}

# 4) Своя (self-hosted) модель: любой OpenAI-совместимый сервер — Ollama, vLLM, LM Studio, корпоративный шлюз.
#    Удобно для массовых T1-задач (классификация, оценка по признакам) и когда данные нельзя отдавать в облако.
#    Ключ — только в переменной окружения (имя в api_key_env), не в файле. Модели сервера попадут в инвентарь
#    только после отдельной проверки: автоматический HTTP scan выключен. Effort — reasoning_effort (send_effort: false — не передавать).
# selfhosted:
#   base_url: http://localhost:11434/v1      # Ollama; vLLM обычно http://localhost:8000/v1
#   api_key_env: SELFHOSTED_API_KEY          # необязательно
#   send_effort: false
# families:
#   selfhosted: {inventory: selfhosted, T1: "qwen3:8b", T2: null, T3: null, T4: null}
# delegate_backends: [selfhosted, codex, claude, opencode]   # сначала своя модель

# 5) Модель решений на своём сервере (открытые аналоги Jev с тем же протоколом System One, например Kev):
#    поставьте свой провайдер первым. Ключ не нужен, если сервер локальный.
# decision:
#   providers:
#     - {name: kev-local, base_url: "http://localhost:8080/v1", model: kev-4b}
#     - {name: openrouter, base_url: "https://openrouter.ai/api/v1", model: typesafe/jev-1.13, api_key_env: OPENROUTER_API_KEY}

# 6) Исполнение отдельно от рекомендаций. Примеры выше НЕ разрешают вызов.
# По умолчанию subscription_only; Codex требует reviewed profile ниже, остальные CLI manual.
# API opt-in — только после отдельного решения оператора. Это НЕ настройка лимита
# у провайдера: external_cap подтверждает уже установленный внешний лимит аккаунта.
# Без такого лимита маршрут manual. Код не проверяет баланс/тариф и не обещает hard cap.
# execution_policy:
#   mode: api_opt_in
#   max_input_bytes: 128000
#   api:
#     enabled: true
#     grants:
#       - host: selfhosted                   # либо decision для System One
#         provider: my-approved-provider     # должен совпадать с selfhosted.provider
#         endpoint: https://approved.example/v1/chat/completions # точный полный URL
#         models: [exact-reviewed-model-id]  # не glob, не auto/newest
#         efforts: [null, low]               # только проверенные для этой модели
#         budget_usd: 1
#         external_cap:
#           confirmed_by_operator: true
#           amount_usd: 1                   # <= budget_usd, установлен отдельно
#           evidence_ref: local-cap-review  # ссылка на проверку, без секретов
#         context:
#           model_limit: 32000              # подтверждённые токеновые границы
#           plan_limit: 32000
#           user_limit: 16000
#           output_reserve: 1024            # max_completion_tokens (включая reasoning)
#           system_reserve: 2048
# selfhosted:
#   provider: my-approved-provider
#   base_url: https://approved.example/v1
#   api_key_env: SELFHOSTED_API_KEY          # имя, не значение; обязателен в API mode
#   send_effort: true
# При HTTP 401/403/429/timeout — остановка, не переход на другой аккаунт/провайдера.
# decision использует такой же grant, host: decision и endpoint .../systemone.
# Наличие ключа не включает api_opt_in. CLI API adapters не реализованы.

# 7) Subscription-first: заранее авторизованный выделенный Codex ChatGPT profile.
# Login/копирование credentials этот код не выполняет. Оператор выбирает existing
# dedicated CODEX_HOME (0700), auth.json (0600), без config/hooks/plugins/skills.
# Подтверждаются план, отключённый overage и отсутствие MDM/cloud-managed config.
# execution_policy:
#   mode: subscription_only
#   codex_subscription:
#     enabled: true
#     binary: /absolute/path/to/reviewed/codex
#     binary_sha256: <SHA256 reviewed executable>
#     version: "codex-cli <exact reviewed version>"
#     codex_home: /absolute/path/to/dedicated-codex-profile
#     entitlement_confirmed: true
#     overage_disabled: true
#     cli_contract_reviewed: true
#     managed_config_absent: true
#     cloud_managed_config_absent: true
#     evidence_ref: local-profile-review
#     models: [exact-reviewed-model-id]
#     efforts: [low, medium, high]
#     context:
#       model_limit: 32000
#       plan_limit: 32000
#       user_limit: 16000
#       output_reserve: 2048
#       system_reserve: 4096
# Preflight читает границы профиля без CLI/network/writes; runtime перед exec
# проверяет fingerprint/version и login status == Logged in using ChatGPT.
# Ошибка/квота завершает маршрут; API/account/model fallback отсутствует.
