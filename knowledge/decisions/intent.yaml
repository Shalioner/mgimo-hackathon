# Что хочет пользователь короткой фразой (AGENTS.md §1). state — его сообщение и строка из `ledger.py status`.
questions:
  intent:
    type: choice
    instructions: "Что хочет пользователь этим сообщением?"
    criteria:
      new_task: "новая задача или новый продукт — начать проект"
      continue: "продолжить начатую работу (продолжи, дальше, давай)"
      new_data: "принёс новые данные или сообщил о перемене — пересмотр"
      question: "вопрос о готовом результате (почему выбрали, на чём основано)"
      checkpoint_answer: "ответ на вопрос агента на checkpoint (подтверждение, выбор варианта, правка)"
      other: "другое"
