questions:
  stop_go:
    type: noul
    check: {all: ['stop\s*/\s*go'], mode: require}
    instructions: "У каждого эксперимента есть критерий Stop / Go с числом или наблюдаемым признаком?"
    fix: "Заполни Stop / Go: порог или наблюдаемый признак, при котором продолжаем или останавливаемся."
  baseline:
    type: noul
    instructions: "Указано, с чем сравниваем (контроль или исходный уровень) и срок?"
    fix: "Заполни «С чем сравниваем» и «Срок» для каждого EXP."
  side_effects:
    type: noul
    instructions: "Названы ли нежелательные последствия, которые надо отслеживать?"
    fix: "Заполни «Нежелательные последствия» — что может ухудшиться."
