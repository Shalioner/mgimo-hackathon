questions:
  main_block:
    type: noul
    check: {all: ['^\s*(#{1,4}\s*|\*\*)Главное'], mode: decide}
    instructions: "Начинается ли документ с блока «Главное» (вывод с уверенностью)?"
    fix: "Добавь в начало блок «Главное»: вывод (уверенность), что значит для решения, главный пробел."
  three_distinct:
    type: noul
    check: {min_count: {'ALT-\d{3}': 3}, mode: require}
    instructions: "Есть ли минимум три содержательно разных варианта, а не вариации одного действия?"
    fix: "Добавь или замени вариант так, чтобы варианты отличались по сути (что делаем), а не по масштабу одного действия."
  status_quo_kill:
    type: noul
    check: {all: ['оставить как есть|status.quo'], mode: require}
    instructions: "Есть ли среди вариантов «оставить как есть» и «закрыть/заморозить» (или объяснение, почему закрыть неприменимо)?"
    fix: "Добавь ALT «Оставить как есть» и ALT «Закрыть/заморозить» или объясни, почему закрытие неприменимо."
  distinct_axes:
    type: noul
    check: {all: ['Ось различия'], mode: require}
    instructions: "Есть ли у активных вариантов строка «Ось различия» с ≥ 2 разными осями и ≥ 1 ходом в продукте/монетизации?"
    fix: "Добавь строку «Ось различия» (сегмент/ценность/монетизация/канал/ресурсы) и проверь разнообразие ходов."
  weights_and_rule:
    type: noul
    check: {all: ['Вес|Правило выбора'], mode: require}
    instructions: "Объявлены ли веса/правило выбора и согласована ли рекомендация с таблицей (или есть «Почему против таблицы»)?"
    fix: "Укажи веса критериев, правило выбора и порог смены лидера; если рекомендован не лидер — добавь «Почему против таблицы»."
  premise_objection:
    type: noul
    check: {all: ['Возражение к постановке'], mode: require}
    instructions: "Есть ли блок «Возражение к постановке», проверяющий допущения самого брифа?"
    fix: "Добавь раздел «Возражение к постановке» с проверкой ключевого допущения брифа."
  real_objection:
    type: noul
    instructions: "Атакует ли каждое возражение конкретный ID из based_on (без «противоречит цели» / «может не сработать»)?"
    fix: "Перепиши строку «Сильное возражение» в формате «Если [ID] неверно, то …»; у status_quo и kill заполни «Главное основание»."
  same_criteria:
    type: noul
    instructions: "Все варианты сравниваются по одним и тем же критериям?"
    fix: "Оцени каждый вариант по каждому критерию из раздела «Критерии сравнения»."
  human_decides:
    type: noul
    instructions: "Выбор варианта либо оставлен человеку (документ заканчивается вопросом C2), либо прямо приписан человеку (руководитель выбрал, DEC), но не сделан агентом самовольно?"
    fix: "До C2 — сформулируй как рекомендацию агента и закончи вопросом C2; после C2 — укажи, что выбрал руководитель, со ссылкой на DEC."
