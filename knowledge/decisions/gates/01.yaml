questions:
  decision_question:
    type: noul
    check: {all: ['^\s*(#{1,4}\s*|\*\*)Какое решение'], mode: require}
    instructions: "Сформулировано ли решение одной фразой-вопросом с вариантами ответа?"
    fix: "Раздел «Какое решение предстоит принять»: одна фраза-вопрос с вариантами («X, Y или ни во что?»)."
  goal_and_recipient:
    type: noul
    instructions: "Заполнены ли цель и получатель результата (не многоточием)?"
    fix: "Заполни строки «Цель» и «Получатель результата» в таблице брифа."
  criteria:
    type: noul
    instructions: "Указаны ли критерии выбора варианта?"
    fix: "Добавь критерии выбора варианта (2–5 штук) из цели брифа."
  questions_limited:
    type: noul
    instructions: "Вопросов к руководителю не больше пяти и все они блокирующие?"
    fix: "Оставь не больше 5 вопросов; остальное переведи в допущения A1, A2… с тем, как их проверить."
