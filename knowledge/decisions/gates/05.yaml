questions:
  main_block:
    type: noul
    instructions: "Начинается ли документ с блока «Главное» (вывод с уверенностью)?"
    fix: "Добавь в начало блок «Главное»."
  decision_linked:
    type: noul
    instructions: "Указано ли решение (DEC) и кто его принял?"
    fix: "Добавь строку «Решение: DEC-… → выбран ALT-… (решил: роль, дата)»."
  refusals:
    type: noul
    instructions: "Есть ли осознанные отказы — чего продукт не делает и почему?"
    fix: "Заполни раздел «Осознанные отказы»: 2–4 пункта «не делаем …, потому что …»."
  economics_typed:
    type: noul
    instructions: "В таблице польза ↔ затраты у каждой оценки есть основание и тип (fact / assumption / hypothesis)?"
    fix: "У каждой строки таблицы «Польза ↔ затраты» укажи основание [ID] и тип."
  review_triggers:
    type: noul
    instructions: "Названы ли риски и условия пересмотра решения?"
    fix: "Заполни «Риски и условия пересмотра» из DEC.review_triggers."
