questions:
  main_block:
    type: noul
    instructions: "Начинается ли документ с блока «Главное» (вывод с уверенностью)?"
    fix: "Добавь в начало блок «Главное»."
  barrier:
    type: noul
    instructions: "Назван ли конкретный барьер понимания или выбора, с основанием?"
    fix: "Раздел «Барьер»: что именно мешает понять ценность или выбрать, со ссылкой [CLM/HYP]."
  promise_to_feature:
    type: noul
    instructions: "Каждое ключевое сообщение связано с функцией продукта и подтверждением?"
    fix: "В таблице сообщений у каждого PRM заполни «Функция продукта» и «Подтверждение»."
  no_overpromise:
    type: noul
    instructions: "Есть ли раздел «Чего мы не обещаем», согласованный с отказами продуктовой стратегии?"
    fix: "Добавь «Чего мы не обещаем» по «Осознанным отказам» из 05."
