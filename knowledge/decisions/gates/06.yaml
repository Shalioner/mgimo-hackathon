questions:
  main_block:
    type: noul
    check: {all: ['^\s*(#{1,4}\s*|\*\*)Главное'], mode: decide}
    instructions: "Начинается ли документ с блока «Главное» (вывод с уверенностью)?"
    fix: "Добавь в начало блок «Главное»."
  barrier:
    type: noul
    instructions: "Назван ли конкретный барьер понимания или выбора, с основанием?"
    fix: "Раздел «Барьер»: что именно мешает понять ценность или выбрать, со ссылкой [CLM/HYP]."
  promise_to_feature:
    type: noul
    check: {any: ['PRM-\d{3}', '^Режим: только внутренняя диагностика\s*$'], mode: require}
    instructions: "Каждое ключевое сообщение связано с функцией продукта и прямым подтверждением обещанного свойства? Для явно ограниченной внутренней диагностики проверь, что таблица объясняет отказ от показа кандидатов. План эксперимента не подтверждает клиентское обещание."
    fix: "Заполни «Функция продукта» и «Подтверждение». При внутренней диагностике укажи причину отказа от показа."
  no_overpromise:
    type: noul
    check: {all: ['^\s*(#{1,4}\s*|\*\*)Чего мы не обещаем'], mode: require}
    instructions: "Есть ли раздел «Чего мы не обещаем», согласованный с отказами продуктовой стратегии?"
    fix: "Добавь «Чего мы не обещаем» по «Осознанным отказам» из 05."
