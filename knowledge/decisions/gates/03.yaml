questions:
  main_block:
    type: noul
    instructions: "Начинается ли документ с блока «Главное» (вывод с уверенностью, что значит для решения, главный пробел)?"
    fix: "Добавь в начало блок «Главное»: вывод (уверенность), что это значит для решения, главный пробел."
  types_marked:
    type: noul
    instructions: "Разделены ли в тексте известное (факт), интерпретация, противоречия и неизвестное?"
    fix: "По каждому вопросу раздели: Известно [CLM] / Интерпретация / Противоречие / Неизвестно — почему — как узнать."
  gaps_explicit:
    type: noul
    instructions: "Названы ли пробелы явно (неизвестно / почему / как узнать), а не заполнены догадками?"
    fix: "Где данных нет — запиши пробел «Неизвестно: … Почему: … Как узнать: …» вместо догадки."
  synthetic_not_fact:
    type: noul
    instructions: "Нет ли ответов модельных респондентов, поданных как факты о спросе?"
    fix: "Ответы ИИ-респондентов переведи в гипотезы (HYP), не в факты."
