# Поддерживает ли фрагмент источника утверждение (второй проход verify.py для строк check).
# state — фрагмент источника (--input), --items — утверждения [{id: CLM-004, text: "…"}].
questions:
  supports:
    type: score
    instructions: "Насколько текст источника поддерживает утверждение «{text}»?"
    criteria: ["противоречит", "не упоминает", "частично поддерживает", "прямо поддерживает"]
  overstated:
    type: noul
    instructions: "Утверждение «{text}» сильнее, чем сказано в источнике (обобщение, другой период, другая единица)?"
